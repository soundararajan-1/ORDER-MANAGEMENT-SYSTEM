<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OrderFlow AI — Multi-Seller Real-Time Operations</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#00E5FF; --purple:#7C3AED; --indigo:#4338CA; --pink:#EC4899;
    --amber:#F59E0B; --red:#EF4444; --emerald:#10B981;
    --navy:#050816;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--navy); color:#e8ecff;
    font-family:'Inter',sans-serif; overflow-x:hidden; min-height:100vh;
  }
  h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;}

  /* ---------- aurora background ---------- */
  .aurora-wrap{position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--navy);}
  .blob{position:absolute; border-radius:50%; filter:blur(75px); opacity:.55; mix-blend-mode:screen;}
  .b1{width:560px;height:560px; background:radial-gradient(circle,var(--purple),transparent 70%); top:-10%; left:-5%; animation:float1 22s ease-in-out infinite;}
  .b2{width:500px;height:500px; background:radial-gradient(circle,var(--cyan),transparent 70%); bottom:-10%; right:0%; animation:float2 26s ease-in-out infinite;}
  .b3{width:420px;height:420px; background:radial-gradient(circle,var(--pink),transparent 70%); top:35%; left:45%; animation:float3 30s ease-in-out infinite;}
  .stars{position:absolute; inset:0; background-image:radial-gradient(1px 1px at 20% 30%, #ffffff55 1px, transparent 0),
    radial-gradient(1px 1px at 70% 60%, #ffffff33 1px, transparent 0),
    radial-gradient(1px 1px at 40% 80%, #ffffff44 1px, transparent 0),
    radial-gradient(1px 1px at 90% 20%, #ffffff33 1px, transparent 0);
    background-size: 600px 600px; opacity:.6;}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-50px)}}
  @keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,50px) scale(1.15)}}

  /* ---------- glassmorphism ---------- */
  .glass{
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:24px;
    box-shadow: 0 0 0 1px rgba(124,58,237,0.08), 0 20px 60px -20px rgba(0,229,255,0.12);
    transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .3s ease;
  }
  .glass:hover{ transform:translateY(-2px); box-shadow:0 0 40px -5px rgba(0,229,255,.2), 0 0 70px -20px rgba(124,58,237,.3);}
  .glow-border{ position:relative; }
  .glow-border::before{
    content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
    background:linear-gradient(120deg,var(--cyan),var(--purple),var(--pink),var(--cyan));
    background-size:300% 300%; animation:borderMove 6s linear infinite;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; opacity:.55; pointer-events:none;
  }
  @keyframes borderMove{0%{background-position:0% 50%}100%{background-position:300% 50%}}

  /* ---------- floating tabs ---------- */
  .tab{
    padding:.55rem 1.15rem; border-radius:999px; font-size:.85rem; font-weight:500;
    color:#c9d3ff; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px); cursor:pointer; white-space:nowrap;
    transition: all .25s ease; animation: tabFloat 5s ease-in-out infinite;
  }
  .tab:hover{ transform:translateY(-2px) scale(1.03); background:rgba(255,255,255,0.09); color:#fff; }
  .tab.active{
    color:#fff; background:linear-gradient(120deg, rgba(0,229,255,.25), rgba(124,58,237,.35));
    border-color:rgba(0,229,255,.5);
    box-shadow:0 0 25px -3px rgba(0,229,255,.55), 0 0 35px -5px rgba(124,58,237,.55);
  }
  @keyframes tabFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  /* ---------- misc animations ---------- */
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)}}
  .fade-up{animation:fadeUp .45s ease both;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 10px rgba(0,229,255,.35)}50%{box-shadow:0 0 25px rgba(0,229,255,.7)}}
  .pulse{animation:pulseGlow 2.2s ease-in-out infinite;}
  @keyframes popIn{from{opacity:0; transform:scale(.88)}to{opacity:1; transform:scale(1)}}
  .pop-in{animation:popIn .3s cubic-bezier(.2,1.3,.4,1) both;}
  .btn-neon{
    background:linear-gradient(120deg,var(--cyan),var(--purple));
    color:#03131a; font-weight:600; border-radius:14px; padding:.65rem 1.3rem;
    transition:transform .2s ease, box-shadow .2s ease; box-shadow:0 0 20px -4px rgba(0,229,255,.6);
  }
  .btn-neon:hover{transform:translateY(-2px); box-shadow:0 0 30px -2px rgba(0,229,255,.85);}
  .btn-danger{
    background:linear-gradient(120deg,#ef4444,#dc2626);
    color:#fff; font-weight:600; border-radius:12px; padding:.45rem .9rem;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-danger:hover{transform:translateY(-1px); box-shadow:0 0 20px -2px rgba(239,68,68,.7);}
  .btn-warning{
    background:linear-gradient(120deg,#f59e0b,#d97706);
    color:#0a0d1e; font-weight:600; border-radius:12px; padding:.45rem .9rem;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-warning:hover{transform:translateY(-1px); box-shadow:0 0 20px -2px rgba(245,158,11,.7);}

  .scrollbar-thin::-webkit-scrollbar{width:6px;height:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:rgba(0,229,255,.4); border-radius:10px;}

  .timeline-dot{width:14px;height:14px;border-radius:50%; box-shadow:0 0 12px currentColor;}
  .timeline-line{height:3px; background:rgba(255,255,255,.12); position:relative; flex:1;}
  .timeline-fill{position:absolute; inset:0; background:linear-gradient(90deg,var(--cyan),var(--purple)); border-radius:3px; transition:width .6s ease;}

  .hidden{display:none !important;}
  .toast{animation: slideIn .3s ease both;}
  @keyframes slideIn{from{opacity:0; transform:translateX(40px)} to{opacity:1; transform:translateX(0)}}

  #confetti-canvas{position:fixed; inset:0; pointer-events:none; z-index:70;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(5,8,22,0.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); z-index:50;}

  /* ---------- print styles for invoices & shipping labels ---------- */
  @media print {
    body * { visibility: hidden !important; }
    #printableDoc, #printableDoc * { visibility: visible !important; color: #111 !important; }
    #printableDoc {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      background: #ffffff !important;
      color: #111111 !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>

<div class="aurora-wrap">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="stars"></div>
</div>
<canvas id="confetti-canvas"></canvas>
<div id="toast-root" class="fixed top-6 right-6 z-50 flex flex-col gap-2"></div>
<div id="modal-root"></div>
<div id="chatDrawer" data-open="false" class="fixed top-0 right-0 h-full w-full sm:w-[460px] translate-x-full transition-transform duration-300 z-50 p-4"></div>

<div id="app" class="relative z-10 min-h-screen"></div>

<script>
/* ================= CONFIG ================= */
const urlParams = new URLSearchParams(window.location.search);
const overrideApi = urlParams.get("api");
const isDevFrontend = window.location.port === "5500" && (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1");

const CONFIG = {
  API_BASE: overrideApi || (isDevFrontend ? "http://localhost:8000" : window.location.origin),
  WS_BASE: overrideApi 
    ? overrideApi.replace(/^http/, "ws") 
    : (isDevFrontend ? "ws://localhost:8000" : (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host),
};

/* ================= STATE ================= */
const state = {
  token: null, user: null, role: null,
  products: [], cart: [], orders: [], analytics: null, ws: null,
  soundEnabled: true,
  shopSellerFilter: "all",
  sellerOrderFilter: "All",
  sellerSearch: "",
  sellerSort: "newest",
  sellerPage: 1,
  sellerPageSize: 8,
  // New upgraded modules:
  activeCoupon: null,
  coupons: [],
  activeChatOrderId: null,
  activeChatOrder: null,
  chatMessages: [],
  selectedPaymentMethod: "UPI",
  deliveryAddress: "Flat 402, Skyline Towers, Indiranagar, Bangalore - 560038",
  deliveryPhone: "+91 98765 43210",
};

/* ================= AUDIO CHIME ================= */
function playOrderChime() {
  if (!state.soundEnabled) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();

    osc1.type = "sine";
    osc1.frequency.setValueAtTime(587.33, now); // D5
    osc1.frequency.exponentialRampToValueAtTime(880, now + 0.12); // A5

    osc2.type = "triangle";
    osc2.frequency.setValueAtTime(880, now);
    osc2.frequency.exponentialRampToValueAtTime(1174.66, now + 0.12); // D6

    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 0.6);
    osc2.stop(now + 0.6);
  } catch(e) {}
}

/* ================= HELPERS ================= */
function toast(msg, kind="info"){
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  const color = kind==="success" ? "border-emerald-400/60 shadow-emerald-500/20" :
                kind==="error" ? "border-red-400/60 shadow-red-500/20" :
                kind==="warning" ? "border-amber-400/60 shadow-amber-500/20" :
                "border-cyan-400/60 shadow-cyan-500/20";
  el.className = `toast glass ${color} shadow-lg px-4 py-3 text-sm max-w-sm flex items-center gap-2.5`;
  const icon = kind==="success" ? "✓" : kind==="error" ? "✕" : kind==="warning" ? "⚠️" : "⚡";
  el.innerHTML = `<span class="font-bold">${icon}</span> <span>${msg}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .4s"; setTimeout(()=>el.remove(),400); }, 3800);
}

async function api(path, opts={}){
  const headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if(state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(CONFIG.API_BASE + path, Object.assign({}, opts, {headers}));
  if(!res.ok){
    let detail = res.statusText;
    try{ detail = (await res.json()).detail || detail; }catch(e){}
    throw new Error(detail);
  }
  return res.status===204 ? null : res.json();
}

function countUp(el, target, prefix="", suffix=""){
  let cur = 0; const step = Math.max(target/40, 1);
  const iv = setInterval(()=>{
    cur += step;
    if(cur >= target){ cur = target; clearInterval(iv); }
    el.textContent = prefix + Math.round(cur).toLocaleString() + suffix;
  }, 20);
}

function confettiBurst(){
  const canvas = document.getElementById("confetti-canvas");
  canvas.width = innerWidth; canvas.height = innerHeight;
  const ctx = canvas.getContext("2d");
  const colors = ["#00E5FF","#7C3AED","#EC4899","#22c55e","#F59E0B"];
  const pieces = Array.from({length:140}, ()=>({
    x: innerWidth/2, y: innerHeight/2,
    vx:(Math.random()-.5)*16, vy:(Math.random()-1.3)*16,
    size: 4+Math.random()*6, color: colors[Math.floor(Math.random()*colors.length)],
    life: 70+Math.random()*30,
  }));
  let frame=0;
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    frame++;
    let alive=false;
    pieces.forEach(p=>{
      if(p.life<=0) return;
      alive=true;
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.life--;
      ctx.fillStyle=p.color; ctx.globalAlpha = Math.max(p.life/90,0);
      ctx.fillRect(p.x,p.y,p.size,p.size);
    });
    ctx.globalAlpha=1;
    if(alive && frame<160) requestAnimationFrame(tick); else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  tick();
}

/* ================= WEBSOCKET ================= */
function connectWebSocket(){
  if(state.ws) {
    try { state.ws.close(); } catch(e){}
  }
  const ws = new WebSocket(`${CONFIG.WS_BASE}/ws/${state.role}/${state.user.id}`);
  ws.onopen = ()=> setInterval(()=>{ if(ws.readyState===1) ws.send("ping"); }, 20000);
  ws.onmessage = (ev)=>{
    const msg = JSON.parse(ev.data);

    // 1. Incoming new order (Sent specifically to THIS particular seller!)
    if(state.role === "seller" && msg.type === "new_order"){
      playOrderChime();
      toast(`⚡ Incoming Order #${msg.order.id} — ₹${msg.order.amount.toLocaleString()}`, "success");
      state.orders.unshift(msg.order);
      refreshActiveSellerTab();
    }

    // 2. Order status update
    if(msg.type === "status_update"){
      const idx = state.orders.findIndex(o=>o.id===msg.order.id);
      if(idx>-1) state.orders[idx] = msg.order; else state.orders.unshift(msg.order);

      if(state.role === "seller"){
        refreshActiveSellerTab();
      }
      if(state.role === "customer"){
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "My Orders";
        if(activeTab === "My Orders") {
          renderCustomerOrders();
        }
        if(msg.order.status === "Completed") {
          confettiBurst();
          toast(`🎉 Order #${msg.order.id} has been Delivered!`, "success");
        } else if(msg.order.status === "Delayed") {
          toast(`⚠️ Order #${msg.order.id} Delayed (ETA ${msg.order.eta}): ${msg.order.delay_reason || 'In Transit'}`, "warning");
        } else if(msg.order.status === "Cancelled") {
          toast(`Order #${msg.order.id} was Cancelled (Inventory refunded)`, "error");
        } else {
          toast(`Order #${msg.order.id} status: ${msg.order.status}`, "success");
        }
      }
    }

    // 3. Inventory update
    if(msg.type === "inventory_update"){
      const pIdx = state.products.findIndex(p=>p.id===msg.product.id);
      if(pIdx>-1) state.products[pIdx] = msg.product; else state.products.push(msg.product);

      if(state.role === "customer") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "Shop";
        if(activeTab === "Shop") renderShop(false);
      } else if(state.role === "seller") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab;
        if(activeTab === "Products & Stock") renderInventory();
        else if(activeTab === "Overview") renderSellerOverview();
      }
    }

    // 4. Product added
    if(msg.type === "product_added"){
      const pIdx = state.products.findIndex(p=>p.id===msg.product.id);
      if(pIdx===-1) state.products.push(msg.product);
      if(state.role === "customer") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "Shop";
        if(activeTab === "Shop") renderShop(false);
      } else if(state.role === "seller") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab;
        if(activeTab === "Products & Stock") renderInventory();
      }
    }

    // 5. Product deleted
    if(msg.type === "product_deleted"){
      state.products = state.products.filter(p=>p.id!==msg.product_id);
      state.cart = state.cart.filter(i=>i.product_id!==msg.product_id);
      if(state.role === "customer") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "Shop";
        if(activeTab === "Shop") renderShop(false);
      } else if(state.role === "seller") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab;
        if(activeTab === "Products & Stock") renderInventory();
      }
    }

    // 6. Payment update (Seller verified payment / COD accepted)
    if(msg.type === "payment_update"){
      const idx = state.orders.findIndex(o=>o.id===msg.order.id);
      if(idx>-1) state.orders[idx] = msg.order; else state.orders.unshift(msg.order);
      playOrderChime();
      if(state.role === "seller"){
        toast(`💰 Payment confirmed for Order #${msg.order.id}`, "success");
        refreshActiveSellerTab();
      } else {
        toast(`💰 Order #${msg.order.id} payment verified: ${msg.order.payment_status}`, "success");
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "My Orders";
        if(activeTab === "My Orders") renderCustomerOrders();
      }
    }

    // 7. Real-time Customer <-> Seller Chat Message
    if(msg.type === "chat_message"){
      playOrderChime();
      if(state.activeChatOrderId === msg.message.order_id){
        state.chatMessages.push(msg.message);
        renderChatMessages();
      } else {
        toast(`💬 [Order #${msg.message.order_id}] ${msg.message.sender_name}: "${msg.message.message}"`, "info");
      }
    }
  };
  state.ws = ws;
}

function refreshActiveSellerTab(){
  const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "Overview";
  renderSeller(activeTab);
}

/* ================= LOGIN & 7-DIGIT ID AUTH ================= */
async function renderLogin(){
  const app = document.getElementById("app");
  const urlParams = new URLSearchParams(window.location.search);
  let currentRole = urlParams.get("role") === "seller" ? "seller" : "customer";

  // Pre-load default profiles
  let profiles = {sellers: [], customers: []};
  try {
    profiles = await api("/api/auth/quick-profiles");
  } catch(e){}

  app.innerHTML = `
  <div class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="glass glow-border p-8 sm:p-10 w-full max-w-lg fade-up relative z-20">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-3 shadow-lg shadow-cyan-500/20" style="background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(124,58,237,.3)); border:1px solid rgba(0,229,255,0.4);">
          <span class="text-3xl">⚡</span>
        </div>
        <h1 class="text-3xl font-bold mb-1 bg-clip-text text-transparent" style="background-image:linear-gradient(120deg,var(--cyan),var(--purple));-webkit-background-clip:text;">OrderFlow AI</h1>
        <p class="text-xs text-white/60">Multi-Seller Marketplace & Order Management</p>
      </div>

      <!-- Role Switcher -->
      <div class="flex justify-center gap-3 mb-6 p-1.5 rounded-full bg-white/5 border border-white/10">
        <button id="roleCustomerBtn" class="tab flex-1 ${currentRole==='customer'?'active':''}">🛒 Customer</button>
        <button id="roleSellerBtn" class="tab flex-1 ${currentRole==='seller'?'active':''}">🏪 Seller Hub</button>
      </div>

      <!-- 7-Digit ID Login Form -->
      <form id="idLoginForm" class="space-y-4 mb-6">
        <div>
          <label class="block text-xs font-semibold text-white/70 mb-1 flex justify-between">
            <span id="idInputLabel">${currentRole==='seller' ? '7-Digit Seller ID' : '7-Digit Customer ID'}</span>
            <span class="text-[10px] text-cyan-300 font-mono">Exactly 7 digits</span>
          </label>
          <input id="loginIdInput" required type="text" maxlength="7" pattern="[0-9]{7}" placeholder="${currentRole==='seller' ? '1001001' : '7001001'}" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm font-mono text-white focus:outline-none focus:border-cyan-400 placeholder-white/30 tracking-wider text-base" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-white/70 mb-1">Password</label>
          <input id="loginPwInput" required type="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 placeholder-white/30" />
        </div>

        <button type="submit" class="btn-neon w-full font-bold py-3 text-sm cursor-pointer shadow-lg hover:scale-[1.01] transition-transform">
          Sign In with 7-Digit ID →
        </button>
      </form>

      <!-- Quick 1-Click Demo Profiles -->
      <div class="pt-4 border-t border-white/10 mb-4">
        <p class="text-[11px] uppercase tracking-wider text-white/50 font-bold mb-2.5 flex items-center justify-between">
          <span>⚡ Instant 1-Click Profile Test:</span>
          <span class="text-cyan-300 font-mono text-[10px]">Pre-filled credentials</span>
        </p>
        <div id="quickProfilesContainer" class="flex flex-col gap-2"></div>
      </div>

      <!-- Register New Account Link -->
      <div class="text-center pt-3 border-t border-white/5">
        <p class="text-xs text-white/50">
          Don't have a 7-digit ID?
          <button id="openRegisterModalBtn" class="text-cyan-300 font-semibold hover:underline cursor-pointer ml-1">Register New Account</button>
        </p>
      </div>
    </div>
  </div>`;

  function updateLoginUi(){
    const label = document.getElementById("idInputLabel");
    const input = document.getElementById("loginIdInput");
    const pw = document.getElementById("loginPwInput");
    if(currentRole === "seller"){
      label.textContent = "7-Digit Seller ID";
      input.placeholder = "1001001";
      pw.value = "seller123";
    } else {
      label.textContent = "7-Digit Customer ID";
      input.placeholder = "7001001";
      pw.value = "customer123";
    }

    // Render quick profile chips
    const qRoot = document.getElementById("quickProfilesContainer");
    const list = currentRole === "seller" ? profiles.sellers : profiles.customers;
    const defaultPw = currentRole === "seller" ? "seller123" : "customer123";

    qRoot.innerHTML = list.map(u=>`
      <button type="button" class="quick-chip glass px-3.5 py-2.5 rounded-xl text-left flex items-center justify-between hover:border-cyan-400/50 transition-all cursor-pointer text-xs" data-id="${u.id}" data-pw="${defaultPw}">
        <div class="flex items-center gap-2.5">
          <span class="text-lg">${currentRole==='seller'?'🏪':'👤'}</span>
          <div>
            <p class="font-bold text-white">${u.name}</p>
            <p class="text-[10px] text-white/40 font-mono">ID: #${u.id}</p>
          </div>
        </div>
        <span class="text-[10px] px-2 py-1 rounded bg-cyan-500/20 text-cyan-300 font-medium">Click to Login</span>
      </button>
    `).join("") || '<p class="text-xs text-white/40">Loading profiles...</p>';

    qRoot.querySelectorAll(".quick-chip").forEach(chip=>{
      chip.onclick = ()=>{
        document.getElementById("loginIdInput").value = chip.dataset.id;
        document.getElementById("loginPwInput").value = chip.dataset.pw;
        performIdLogin(chip.dataset.id, chip.dataset.pw, currentRole);
      };
    });
  }

  document.getElementById("roleCustomerBtn").onclick = ()=>{
    currentRole="customer";
    document.getElementById("roleCustomerBtn").classList.add("active");
    document.getElementById("roleSellerBtn").classList.remove("active");
    updateLoginUi();
  };
  document.getElementById("roleSellerBtn").onclick = ()=>{
    currentRole="seller";
    document.getElementById("roleSellerBtn").classList.add("active");
    document.getElementById("roleCustomerBtn").classList.remove("active");
    updateLoginUi();
  };

  document.getElementById("idLoginForm").onsubmit = (e)=>{
    e.preventDefault();
    const id = document.getElementById("loginIdInput").value.trim();
    const pw = document.getElementById("loginPwInput").value;
    performIdLogin(id, pw, currentRole);
  };

  document.getElementById("openRegisterModalBtn").onclick = ()=> openRegisterModal(currentRole);

  updateLoginUi();

  // If URL specifies role and auto, automatically sign in as first default
  if(urlParams.get("auto") === "true"){
    const defaultId = currentRole === "seller" ? "1001001" : "7001001";
    const defaultPw = currentRole === "seller" ? "seller123" : "customer123";
    performIdLogin(defaultId, defaultPw, currentRole);
  }
}

async function performIdLogin(id, password, role){
  try {
    const data = await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ id, password, role })
    });
    state.token = data.access_token;
    state.user = data.user;
    state.role = role;
    toast(`Welcome, ${data.user.name} (#${data.user.id})!`, "success");
    connectWebSocket();
    if(role === "customer") await enterCustomer(); else await enterSeller();
  } catch(e) {
    toast(e.message, "error");
  }
}

async function applyCoupon(code){
  const rawSubtotal = state.cart.reduce((s,i)=>s+i.price*i.qty,0);
  try{
    const res = await api("/api/coupons/validate", {
      method: "POST",
      body: JSON.stringify({code, order_amount: rawSubtotal})
    });
    state.activeCoupon = res;
    toast(res.message, "success");
    openCart();
  }catch(e){
    toast("Coupon: " + e.message, "error");
  }
}

async function placeOrder(){
  const rawSubtotal = state.cart.reduce((s,i)=>s+i.price*i.qty,0);
  if(rawSubtotal <= 0) return;

  const addr = (document.getElementById("deliveryAddressInput")?.value || state.deliveryAddress).trim();
  const phone = (document.getElementById("deliveryPhoneInput")?.value || state.deliveryPhone).trim();
  state.deliveryAddress = addr;
  state.deliveryPhone = phone;

  const btn = document.getElementById("checkoutBtn");
  if(btn){
    btn.disabled = true;
    btn.innerHTML = `<span class="inline-block animate-spin mr-2">⚙️</span> Processing ${state.selectedPaymentMethod} Payment...`;
  }

  try{
    const res = await api("/api/orders", {
      method:"POST",
      body: JSON.stringify({
        items: state.cart.map(i=>({product_id: i.product_id, name: i.name, price: i.price, qty: i.qty})),
        payment_method: state.selectedPaymentMethod,
        shipping_address: `${addr} (Ph: ${phone})`,
        coupon_code: state.activeCoupon ? state.activeCoupon.code : "",
        discount_amount: state.activeCoupon ? (state.activeCoupon.discount_amount || 0) : 0
      })
    });

    if(res.orders){
      res.orders.forEach(o=> state.orders.unshift(o));
    } else if(res.order){
      state.orders.unshift(res.order);
    }
    state.cart = [];
    state.activeCoupon = null;

    const drawer = document.getElementById("cartDrawer");
    if(drawer){
      drawer.dataset.open = "false";
      drawer.style.transform = "translateX(100%)";
    }

    confettiBurst();
    toast(res.message || "Order placed successfully!", "success");
    renderCustomer("My Orders");
  }catch(e){
    toast("Order failed: " + e.message, "error");
    if(btn){
      btn.disabled = false;
      btn.innerHTML = `<span>Place Order</span> ⚡`;
    }
  }
}

async function customerCancelOrder(orderId){
  if(!confirm("Are you sure you want to cancel this order? The stock will be returned.")) return;
  try{
    await api(`/api/orders/${orderId}/status`, {method:"PATCH", body: JSON.stringify({status: "Cancelled"})});
    toast(`Order #${orderId} cancelled`, "info");
    const idx = state.orders.findIndex(o=>o.id===orderId);
    if(idx>-1) state.orders[idx].status = "Cancelled";
    renderCustomerOrders();
  }catch(e){ toast("Cancellation failed: " + e.message, "error"); }
}

/* ---------- TAB 2: LIVE ORDERS (SPECIFIC TO THIS SELLER) ---------- */
function renderSellerOrders(){
  const body = document.getElementById("sellerBody");
  if(!body) return;

  let filtered = state.orders.slice();
  if(state.sellerOrderFilter !== "All"){
    filtered = filtered.filter(o=>o.status === state.sellerOrderFilter);
  }
  if(state.sellerSearch.trim()){
    const term = state.sellerSearch.toLowerCase();
    filtered = filtered.filter(o=>
      o.id.toLowerCase().includes(term) ||
      o.customer_name.toLowerCase().includes(term) ||
      o.items.some(i=>i.name.toLowerCase().includes(term))
    );
  }

  // Sorting
  if(state.sellerSort === "highest"){
    filtered.sort((a,b)=>b.amount - a.amount);
  } else if(state.sellerSort === "lowest"){
    filtered.sort((a,b)=>a.amount - b.amount);
  } else if(state.sellerSort === "oldest"){
    filtered.sort((a,b)=>a.created_at.localeCompare(b.created_at));
  } else {
    filtered.sort((a,b)=>b.created_at.localeCompare(a.created_at));
  }

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / state.sellerPageSize));
  if(state.sellerPage > totalPages) state.sellerPage = totalPages;
  const startIdx = (state.sellerPage - 1) * state.sellerPageSize;
  const pageOrders = filtered.slice(startIdx, startIdx + state.sellerPageSize);

  const counts = {
    All: state.orders.length,
    Placed: state.orders.filter(o=>o.status==="Placed").length,
    Processing: state.orders.filter(o=>o.status==="Processing").length,
    Delayed: state.orders.filter(o=>o.status==="Delayed").length,
    Completed: state.orders.filter(o=>o.status==="Completed").length,
    Cancelled: state.orders.filter(o=>o.status==="Cancelled").length,
  };

  body.innerHTML = `
    <div class="glass p-5 mb-5 fade-up">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
        <div>
          <h3 class="text-xl font-bold text-white flex items-center gap-2">
            <span>Store Orders · ${state.user.name}</span>
            <span class="text-xs text-emerald-300 pulse px-2.5 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 font-mono">● LIVE</span>
          </h3>
          <p class="text-xs text-white/50 mt-0.5">Showing orders routed specifically to Seller ID #${state.user.id}</p>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto">
          <div class="relative flex-1 md:w-64">
            <input id="sellerSearchInput" type="text" placeholder="Search ID, customer, item..." value="${state.sellerSearch}" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white placeholder-white/40 focus:outline-none focus:border-cyan-400" />
            ${state.sellerSearch ? `<button id="clearSearchBtn" class="absolute right-2.5 top-1.5 text-xs text-white/40 hover:text-white cursor-pointer">✕</button>` : ''}
          </div>

          <select id="sellerSortSelect" class="bg-white/5 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-400 cursor-pointer">
            <option value="newest" class="bg-[#050816]" ${state.sellerSort==='newest'?'selected':''}>Newest First</option>
            <option value="oldest" class="bg-[#050816]" ${state.sellerSort==='oldest'?'selected':''}>Oldest First</option>
            <option value="highest" class="bg-[#050816]" ${state.sellerSort==='highest'?'selected':''}>Highest Amount</option>
            <option value="lowest" class="bg-[#050816]" ${state.sellerSort==='lowest'?'selected':''}>Lowest Amount</option>
          </select>
        </div>
      </div>

      <!-- Filter Chips -->
      <div class="flex gap-2 overflow-x-auto scrollbar-thin pb-1">
        ${["All","Placed","Processing","Delayed","Completed","Cancelled"].map(st=>`
          <button class="px-3 py-1 rounded-full text-xs font-medium cursor-pointer transition-all border shrink-0 ${state.sellerOrderFilter===st ? 'bg-cyan-500/20 text-cyan-300 border-cyan-400' : 'bg-white/5 text-white/60 border-white/10 hover:bg-white/10'}" data-filter="${st}">
            ${st} <span class="ml-1 opacity-60 text-[10px]">(${counts[st]||0})</span>
          </button>
        `).join("")}
      </div>
    </div>

    <!-- Orders Table -->
    <div class="glass overflow-x-auto scrollbar-thin mb-4">
      <table class="w-full text-sm">
        <thead class="text-white/40 text-left border-b border-white/10 text-xs uppercase tracking-wider">
          <tr>
            <th class="p-4">Order ID & Date</th>
            <th class="p-4">Customer</th>
            <th class="p-4">Items</th>
            <th class="p-4">Amount</th>
            <th class="p-4">Status</th>
            <th class="p-4">ETA / Delay</th>
            <th class="p-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="ordersTbody">
          ${pageOrders.map(o=>`
            <tr class="border-t border-white/5 fade-up hover:bg-white/[0.02] transition-colors">
              <td class="p-4 font-mono font-semibold text-white">#${o.id}<br><span class="text-[10px] text-white/40 font-sans">${o.created_at.replace("T"," ").slice(0,16)}</span></td>
              <td class="p-4 font-medium text-white">${o.customer_name}</td>
              <td class="p-4 text-xs text-white/70 max-w-xs">${o.items.map(i=>`${i.name} (x${i.qty})`).join(', ')}</td>
              <td class="p-4 font-bold text-cyan-300">₹${o.amount.toLocaleString()}</td>
              <td class="p-4">${statusBadge(o.status)}</td>
              <td class="p-4 text-xs">
                <span class="font-mono text-white">${o.eta}</span>
                ${o.delay_reason ? `<br><span class="text-[10px] text-amber-300">⚠️ ${o.delay_reason}</span>` : ''}
              </td>
              <td class="p-4 text-right">
                <div class="flex items-center justify-end gap-1.5 flex-wrap">
                  ${sellerActionButtons(o)}
                </div>
              </td>
            </tr>
          `).join("") || `<tr><td class="p-8 text-center text-white/40 text-xs" colspan="7">No matching orders found for this store.</td></tr>`}
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex justify-between items-center text-xs text-white/50 px-2">
      <span>Showing ${total > 0 ? startIdx + 1 : 0} - ${Math.min(startIdx + state.sellerPageSize, total)} of ${total} orders</span>
      <div class="flex items-center gap-2">
        <button id="prevPageBtn" class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 disabled:opacity-30 disabled:pointer-events-none cursor-pointer" ${state.sellerPage<=1?'disabled':''}>← Previous</button>
        <span class="font-medium text-white">Page ${state.sellerPage} of ${totalPages}</span>
        <button id="nextPageBtn" class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 disabled:opacity-30 disabled:pointer-events-none cursor-pointer" ${state.sellerPage>=totalPages?'disabled':''}>Next →</button>
      </div>
    </div>
  `;

  body.querySelectorAll("[data-filter]").forEach(btn=>{
    btn.onclick = ()=>{
      state.sellerOrderFilter = btn.dataset.filter;
      state.sellerPage = 1;
      renderSellerOrders();
    };
  });

  const sInput = document.getElementById("sellerSearchInput");
  sInput.oninput = (e)=>{
    state.sellerSearch = e.target.value;
    state.sellerPage = 1;
    renderSellerOrders();
  };
  const clearBtn = document.getElementById("clearSearchBtn");
  if(clearBtn) clearBtn.onclick = ()=>{
    state.sellerSearch = "";
    state.sellerPage = 1;
    renderSellerOrders();
  };

  document.getElementById("sellerSortSelect").onchange = (e)=>{
    state.sellerSort = e.target.value;
    renderSellerOrders();
  };

  const prevBtn = document.getElementById("prevPageBtn");
  if(prevBtn) prevBtn.onclick = ()=>{ if(state.sellerPage > 1){ state.sellerPage--; renderSellerOrders(); } };
  const nextBtn = document.getElementById("nextPageBtn");
  if(nextBtn) nextBtn.onclick = ()=>{ if(state.sellerPage < totalPages){ state.sellerPage++; renderSellerOrders(); } };
}

function sellerActionButtons(o){
  if(o.status === "Cancelled") return `<span class="text-xs text-white/30">Cancelled</span>`;
  if(o.status === "Completed"){
    return `
      <span class="text-xs text-emerald-400 font-semibold">✓ Delivered</span>
      <button class="text-[11px] px-2.5 py-1 rounded-xl bg-white/5 hover:bg-white/10 text-cyan-300 border border-cyan-500/30 cursor-pointer" onclick="openInvoiceModal('${o.id}')">📄 Invoice</button>
      <button class="text-[11px] px-2.5 py-1 rounded-xl bg-purple-500/15 hover:bg-purple-500/25 text-purple-300 border border-purple-500/30 cursor-pointer" onclick="openChatDrawer('${o.id}')">💬 Chat</button>
    `;
  }

  const paymentPending = o.payment_status && (o.payment_status === 'Pending COD' || o.payment_status === 'Pending');
  let payBtn = paymentPending
    ? `<button class="text-[11px] px-2 py-1 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 cursor-pointer font-semibold" onclick="sellerAcceptPayment('${o.id}')">💰 Accept COD</button>`
    : '';

  let advanceBtn = '';
  if(o.status === "Placed"){
    advanceBtn = `<button class="btn-neon text-[11px] py-1 px-2.5 cursor-pointer" onclick="advanceOrderStatus('${o.id}', 'Processing')">Process</button>`;
  } else if(o.status === "Processing" || o.status === "Delayed"){
    advanceBtn = `<button class="btn-neon text-[11px] py-1 px-2.5 cursor-pointer" onclick="advanceOrderStatus('${o.id}', 'Completed')">Complete</button>`;
  }

  return `
    ${advanceBtn}
    ${payBtn}
    <button class="text-[11px] px-2 py-1 rounded-xl bg-purple-500/15 hover:bg-purple-500/25 text-purple-300 border border-purple-500/30 cursor-pointer" onclick="openChatDrawer('${o.id}')">💬</button>
    <button class="btn-warning text-[11px] py-1 px-2.5 cursor-pointer" onclick="openDelayModal('${o.id}', '${o.eta}')">Delay</button>
    <button class="btn-danger text-[11px] py-1 px-2.5 cursor-pointer" onclick="openCancelModal('${o.id}')">Cancel</button>
  `;
}

async function sellerAcceptPayment(orderId){
  try{
    const updated = await api(`/api/orders/${orderId}/accept-payment`, {method: 'POST'});
    const idx = state.orders.findIndex(o=>o.id===orderId);
    if(idx>-1) state.orders[idx] = updated;
    toast(`💰 Payment accepted for Order #${orderId}!`, 'success');
    refreshActiveSellerTab();
  }catch(e){ toast('Payment acceptance failed: '+e.message, 'error'); }
}

async function advanceOrderStatus(id, status){
  try{
    const updated = await api(`/api/orders/${id}/status`, {method:"PATCH", body: JSON.stringify({status})});
    const idx = state.orders.findIndex(o=>o.id===id);
    if(idx>-1) state.orders[idx] = updated;
    toast(`Order #${id} marked as ${status}`, "success");
    refreshActiveSellerTab();
  }catch(e){ toast("Status update failed: "+e.message, "error"); }
}

async function adjustProductStock(productId, delta){
  try{
    const updated = await api(`/api/products/${productId}/stock`, {method:"PATCH", body: JSON.stringify({delta})});
    const pIdx = state.products.findIndex(p=>p.id===productId);
    if(pIdx>-1) state.products[pIdx] = updated;
    toast(`Updated ${updated.name} stock to ${updated.stock}`, "success");
    renderInventory();
  }catch(e){ toast("Stock update failed: "+e.message, "error"); }
}

async function deleteProductPrompt(productId, productName){
  if(!confirm(`Are you sure you want to delete "${productName}" from your store catalog?`)) return;
  try{
    await api(`/api/products/${productId}`, {method:"DELETE"});
    state.products = state.products.filter(p=>p.id!==productId);
    toast(`Deleted ${productName}`, "info");
    renderInventory();
  }catch(e){ toast("Deletion failed: "+e.message, "error"); }
}

                <p class="text-[11px] text-white/50 mb-2">${o.items.map(i=>i.name+' x'+i.qty).join(', ')}</p>

                <div class="flex items-center justify-between pt-2 border-t border-white/5 mt-2">

              </div>
            `).join("") || '<p class="text-white/30 text-xs text-center py-8">No orders in stage</p>'}

      }).join("")}

}

function statusBadge(status){
  const map = {
    Placed: "bg-cyan-500/20 text-cyan-300 border border-cyan-500/40",
    Processing: "bg-orange-500/20 text-orange-300 border border-orange-500/40",
    Delayed: "bg-amber-500/20 text-amber-300 border border-amber-500/40 animate-pulse font-semibold",
    Completed: "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-semibold",
    Cancelled: "bg-red-500/20 text-red-300 border border-red-500/40"
  };
  return `<span class="text-xs px-2.5 py-0.5 rounded-full ${map[status]||'bg-white/10 text-white'}">${status}</span>`;
}

          </div>
        </form>
      </div>
    </div>`;

  document.getElementById('cpnType').onchange = (e)=>{
    document.getElementById('cpnValueLabel').textContent = e.target.value === 'percent' ? 'Discount Value (%)' : 'Discount Value (₹)';
  };

  document.getElementById('createCouponForm').onsubmit = async(e)=>{
    e.preventDefault();
    const code = document.getElementById('cpnCode').value;
    const discount_type = document.getElementById('cpnType').value;
    const discount_value = parseFloat(document.getElementById('cpnValue').value);
    const min_order = parseFloat(document.getElementById('cpnMinOrder').value) || 0;
    try{
      const created = await api('/api/coupons', {
        method: 'POST',
        body: JSON.stringify({code, discount_type, discount_value, min_order})
      });
      toast(`Coupon '${created.code}' created!`, 'success');
      closeModal();
      await renderSellerCoupons();
    }catch(err){ toast('Failed: '+err.message, 'error'); }
  };
}

async function deleteCoupon(couponId, code){
  if(!confirm(`Delete coupon '${code}'? This cannot be undone.`)) return;
  try{
    await api(`/api/coupons/${couponId}`, {method: 'DELETE'});
    toast(`Coupon '${code}' deleted`, 'info');
    await renderSellerCoupons();
  }catch(e){ toast('Delete failed: '+e.message, 'error'); }
}

async function openChatDrawer(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  state.activeChatOrderId = orderId;
  state.activeChatOrder = order || {id: orderId};

  let messages = [];
  try{ messages = await api(`/api/orders/${orderId}/messages`); }catch(e){}
  state.chatMessages = messages;

  const drawer = document.getElementById('chatDrawer');
  const other = state.role === 'customer' ? (order?.seller_name || 'Seller') : (order?.customer_name || 'Customer');
  const otherIcon = state.role === 'customer' ? '🏪' : '👤';

  drawer.innerHTML = `
    <div class="glass glow-border h-full p-4 flex flex-col pop-in bg-[#070b22]/98 border-purple-400/40 overflow-hidden">
      <!-- Header -->
      <div class="flex justify-between items-center pb-3 mb-3 border-b border-white/10 shrink-0">
        <div>
          <h3 class="font-bold text-base text-white flex items-center gap-2">
            <span>💬 Order Chat</span>
            <span class="text-xs font-mono text-purple-300 px-2 py-0.5 bg-purple-500/10 rounded-md border border-purple-500/20">#${orderId}</span>
          </h3>
          <p class="text-[11px] text-white/50 mt-0.5">${otherIcon} ${other}</p>
        </div>
        <button onclick="closeChatDrawer()" class="text-white/40 hover:text-white cursor-pointer p-1">✕</button>
      </div>

      <!-- Messages -->
      <div id="chatMessagesContainer" class="flex-1 overflow-y-auto scrollbar-thin space-y-3 pr-1 pb-2"></div>

      <!-- Input -->
      <div class="pt-3 border-t border-white/10 shrink-0">
        <div class="flex gap-2">
          <input id="chatInput" type="text" placeholder="Type a message..." maxlength="500"
            class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-white/40 focus:outline-none focus:border-purple-400"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage();}" />
          <button onclick="sendChatMessage()" class="px-4 py-2.5 rounded-xl text-sm font-bold cursor-pointer flex-shrink-0" style="background:linear-gradient(120deg,#7C3AED,#4338CA);color:#fff;">Send ↗</button>
        </div>
        <p class="text-[10px] text-white/30 mt-1.5">Messages are delivered in real-time to both parties</p>
      </div>
    </div>`;

  drawer.style.transform = 'translateX(0)';
  drawer.dataset.open = 'true';
  renderChatMessages();
}

function closeChatDrawer(){
  const drawer = document.getElementById('chatDrawer');
  drawer.style.transform = 'translateX(100%)';
  drawer.dataset.open = 'false';
  state.activeChatOrderId = null;
  state.activeChatOrder = null;
}

function renderChatMessages(){
  const container = document.getElementById('chatMessagesContainer');
  if(!container) return;

  if(state.chatMessages.length === 0){
    container.innerHTML = `
      <div class="flex flex-col items-center justify-center h-full text-center py-10">
        <span class="text-4xl mb-2">💬</span>
        <p class="text-sm font-bold text-white">Start the conversation</p>
        <p class="text-xs text-white/50 mt-1">Ask about order status, delivery, or anything else</p>
      </div>`;
    return;
  }

  container.innerHTML = state.chatMessages.map(msg=>{
    const isMine = msg.sender_id === state.user.id;
    const time = msg.timestamp.replace('T',' ').slice(11,16);
    const roleIcon = msg.sender_role === 'seller' ? '🏪' : '👤';
    return `
      <div class="flex ${isMine ? 'justify-end' : 'justify-start'}">
        <div class="max-w-[80%] ${isMine ? 'items-end' : 'items-start'} flex flex-col gap-0.5">
          ${!isMine ? `<span class="text-[10px] text-white/40 ml-1">${roleIcon} ${msg.sender_name}</span>` : ''}
          <div class="px-3.5 py-2.5 rounded-2xl text-sm ${isMine
            ? 'rounded-tr-sm text-white' 
            : 'rounded-tl-sm text-white/90 bg-white/10 border border-white/10'
          }" style="${isMine ? 'background:linear-gradient(120deg,#7C3AED,#4338CA)' : ''}">
            ${msg.message}
          </div>
          <span class="text-[9px] text-white/30 ${isMine ? 'text-right mr-1' : 'ml-1'}">${time}</span>
        </div>
      </div>`;
  }).join('');

  container.scrollTop = container.scrollHeight;
}

async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text || !state.activeChatOrderId) return;

  input.value = '';
  try{
    const msg = await api(`/api/orders/${state.activeChatOrderId}/messages`, {
      method: 'POST',
      body: JSON.stringify({message: text})
    });
    // Locally append (the WebSocket will also push to recipient)
    state.chatMessages.push(msg);
    renderChatMessages();
  }catch(e){ toast('Message failed: '+e.message, 'error'); input.value = text; }
}

function openDelayModal(orderId, currentEta){
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-backdrop flex items-center justify-center p-4">
      <div class="glass glow-border p-6 sm:p-7 w-full max-w-md pop-in bg-[#070b22]/95 relative z-50">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
              <span>⏱️ Delay Order #${orderId}</span>
            </h3>
            <p class="text-xs text-white/50">Current ETA: <span class="text-cyan-300 font-mono">${currentEta}</span></p>
          </div>
          <button onclick="closeModal()" class="text-white/40 hover:text-white cursor-pointer p-1">✕</button>
        </div>

        <form id="delayOrderForm" class="space-y-4">
          <div>
            <label class="block text-xs text-white/60 mb-2">Select Delay Minutes</label>
            <div class="grid grid-cols-4 gap-2">
              <button type="button" class="delay-min-btn active py-2 rounded-xl text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-400/50 cursor-pointer" data-mins="15">+15m</button>
              <button type="button" class="delay-min-btn py-2 rounded-xl text-xs font-bold bg-white/5 text-white/70 border border-white/10 cursor-pointer" data-mins="30">+30m</button>
              <button type="button" class="delay-min-btn py-2 rounded-xl text-xs font-bold bg-white/5 text-white/70 border border-white/10 cursor-pointer" data-mins="45">+45m</button>
              <button type="button" class="delay-min-btn py-2 rounded-xl text-xs font-bold bg-white/5 text-white/70 border border-white/10 cursor-pointer" data-mins="60">+1h</button>
            </div>
          </div>

          <div>
            <label class="block text-xs text-white/60 mb-1.5">Reason for Delay</label>
            <div class="flex flex-wrap gap-1.5 mb-2">
              <button type="button" class="reason-chip text-[11px] px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 text-white/80 cursor-pointer" data-reason="Heavy Rain / Weather Issue">Heavy Rain</button>
              <button type="button" class="reason-chip text-[11px] px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 text-white/80 cursor-pointer" data-reason="Traffic Jam / Transit Delay">Traffic Jam</button>
              <button type="button" class="reason-chip text-[11px] px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 text-white/80 cursor-pointer" data-reason="High Order Volume / Packaging">Packaging Delay</button>
            </div>
            <input id="delayReasonInput" required type="text" value="Heavy Rain / Weather Issue" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400" />
          </div>

          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs text-white/60 hover:text-white cursor-pointer">Cancel</button>
            <button type="submit" class="btn-warning text-xs font-semibold px-5 py-2.5 cursor-pointer">Apply Delay & Notify Customer</button>
          </div>
        </form>
      </div>
    </div>`;

  let selectedMins = 15;
  const btns = root.querySelectorAll(".delay-min-btn");
  btns.forEach(b=>{
    b.onclick = ()=>{
      btns.forEach(x=>{ x.className = "delay-min-btn py-2 rounded-xl text-xs font-bold bg-white/5 text-white/70 border border-white/10 cursor-pointer"; });
      b.className = "delay-min-btn py-2 rounded-xl text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-400/50 cursor-pointer";
      selectedMins = +b.dataset.mins;
    };
  });

  root.querySelectorAll(".reason-chip").forEach(chip=>{
    chip.onclick = ()=>{
      document.getElementById("delayReasonInput").value = chip.dataset.reason;
    };
  });

  document.getElementById("delayOrderForm").onsubmit = async (e)=>{
    e.preventDefault();
    const reason = document.getElementById("delayReasonInput").value;
    try{
      const updated = await api(`/api/orders/${orderId}/delay`, {
        method: "POST",
        body: JSON.stringify({delay_minutes: selectedMins, reason})
      });
      const idx = state.orders.findIndex(o=>o.id===orderId);
      if(idx>-1) state.orders[idx] = updated;
      toast(`Order #${orderId} delayed: new ETA ${updated.eta}`, "warning");
      closeModal();
      refreshActiveSellerTab();
    }catch(err){ toast("Delay failed: "+err.message, "error"); }
  };
}

function openCancelModal(orderId){
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-backdrop flex items-center justify-center p-4">
      <div class="glass glow-border p-6 sm:p-7 w-full max-w-md pop-in bg-[#070b22]/95 border-red-500/40 relative z-50">
        <h3 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
          <span>✕ Cancel Order #${orderId}?</span>
        </h3>
        <p class="text-xs text-white/60 mb-4 leading-relaxed">
          Cancelling will immediately notify the customer and automatically refund/restore all purchased item quantities back into available product stock.
        </p>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs text-white/60 hover:text-white cursor-pointer">Nevermind</button>
          <button id="confirmCancelBtn" class="btn-danger text-xs font-semibold px-5 py-2.5 cursor-pointer">Confirm & Refund Stock</button>
        </div>
      </div>
    </div>`;

  document.getElementById("confirmCancelBtn").onclick = async ()=>{
    try{
      const updated = await api(`/api/orders/${orderId}/status`, {
        method: "PATCH",
        body: JSON.stringify({status: "Cancelled"})
      });
      const idx = state.orders.findIndex(o=>o.id===orderId);
      if(idx>-1) state.orders[idx] = updated;
      toast(`Order #${orderId} cancelled. Inventory restored.`, "info");
      closeModal();
      refreshActiveSellerTab();
    }catch(err){ toast("Cancellation failed: "+err.message, "error"); }
  };
}

function closeModal(){
  document.getElementById("modal-root").innerHTML = "";
}
