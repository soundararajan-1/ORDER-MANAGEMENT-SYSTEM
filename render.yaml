services:
  - type: web
    name: orderflow-ai
    env: python
    buildCommand: pip install -r OrderFlow-AI/backend/requirements.txt
    startCommand: uvicorn OrderFlow-AI.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
