<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#00E5FF; --purple:#7C3AED; --indigo:#4338CA; --pink:#EC4899;
    --amber:#F59E0B; --red:#EF4444; --emerald:#10B981;
    --navy:#050816;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--navy); color:#e8ecff;
    font-family:'Inter',sans-serif; overflow-x:hidden; min-height:100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }
  h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;}

  /* ---------- light mode theme ---------- */
  body.light-theme{
    --navy:#f1f5f9; background:#f1f5f9; color:#0f172a;
  }
  body.light-theme .aurora-wrap{ background:#f8fafc; }
  body.light-theme .blob{ opacity:0.18; mix-blend-mode:multiply; }
  body.light-theme .glass{
    background:rgba(255,255,255,0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border:1px solid rgba(15,23,42,0.1);
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.07);
    color:#0f172a;
  }
  body.light-theme .glass:hover{
    box-shadow:0 12px 35px -8px rgba(0,229,255,0.25), 0 8px 30px -10px rgba(124,58,237,0.2);
  }
  body.light-theme .text-white{ color:#0f172a !important; }
  body.light-theme .text-white\/90, body.light-theme .text-white\/80, body.light-theme .text-white\/70,
  body.light-theme .text-white\/60, body.light-theme .text-white\/50, body.light-theme .text-white\/40,
  body.light-theme .text-white\/30, body.light-theme .text-white\/20{ color:#475569 !important; }
  body.light-theme input, body.light-theme select, body.light-theme textarea{
    background:#ffffff !important; color:#0f172a !important; border-color:#cbd5e1 !important;
  }
  body.light-theme .modal-backdrop{ background:rgba(15,23,42,0.65); }

  /* ---------- aurora background ---------- */
  .aurora-wrap{position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--navy);}
  .blob{position:absolute; border-radius:50%; filter:blur(75px); opacity:.55; mix-blend-mode:screen;}
  .b1{width:560px;height:560px; background:radial-gradient(circle,var(--purple),transparent 70%); top:-10%; left:-5%; animation:float1 22s ease-in-out infinite;}
  .b2{width:500px;height:500px; background:radial-gradient(circle,var(--cyan),transparent 70%); bottom:-10%; right:0%; animation:float2 26s ease-in-out infinite;}
  .b3{width:420px;height:420px; background:radial-gradient(circle,var(--pink),transparent 70%); top:35%; left:45%; animation:float3 30s ease-in-out infinite;}
  .stars{position:absolute; inset:0; background-image:radial-gradient(1px 1px at 20% 30%, #ffffff55 1px, transparent 0),
    radial-gradient(1px 1px at 70% 60%, #ffffff33 1px, transparent 0),
    radial-gradient(1px 1px at 40% 80%, #ffffff44 1px, transparent 0),
    radial-gradient(1px 1px at 90% 20%, #ffffff33 1px, transparent 0);
    background-size: 600px 600px; opacity:.6;}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-50px)}}
  @keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,50px) scale(1.15)}}

  /* ---------- glassmorphism ---------- */
  .glass{
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:24px;
    box-shadow: 0 0 0 1px rgba(124,58,237,0.08), 0 20px 60px -20px rgba(0,229,255,0.12);
    transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .3s ease;
  }
  .glass:hover{ transform:translateY(-2px); box-shadow:0 0 40px -5px rgba(0,229,255,.2), 0 0 70px -20px rgba(124,58,237,.3);}
  .glow-border{ position:relative; }
  .glow-border::before{
    content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
    background:linear-gradient(120deg,var(--cyan),var(--purple),var(--pink),var(--cyan));
    background-size:300% 300%; animation:borderMove 6s linear infinite;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; opacity:.55; pointer-events:none;
  }
  @keyframes borderMove{0%{background-position:0% 50%}100%{background-position:300% 50%}}

  /* ---------- floating tabs ---------- */
  .tab{
    padding:.55rem 1.15rem; border-radius:999px; font-size:.85rem; font-weight:500;
    color:#c9d3ff; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px); cursor:pointer; white-space:nowrap;
    transition: all .25s ease; animation: tabFloat 5s ease-in-out infinite;
  }
  .tab:hover{ transform:translateY(-2px) scale(1.03); background:rgba(255,255,255,0.09); color:#fff; }
  .tab.active{
    color:#fff; background:linear-gradient(120deg, rgba(0,229,255,.25), rgba(124,58,237,.35));
    border-color:rgba(0,229,255,.5);
    box-shadow:0 0 25px -3px rgba(0,229,255,.55), 0 0 35px -5px rgba(124,58,237,.55);
  }
  @keyframes tabFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  /* ---------- misc animations ---------- */
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)}}
  .fade-up{animation:fadeUp .45s ease both;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 10px rgba(0,229,255,.35)}50%{box-shadow:0 0 25px rgba(0,229,255,.7)}}
  .pulse{animation:pulseGlow 2.2s ease-in-out infinite;}
  @keyframes popIn{from{opacity:0; transform:scale(.88)}to{opacity:1; transform:scale(1)}}
  .pop-in{animation:popIn .3s cubic-bezier(.2,1.3,.4,1) both;}
  .btn-neon{
    background:linear-gradient(120deg,var(--cyan),var(--purple));
    color:#03131a; font-weight:600; border-radius:14px; padding:.65rem 1.3rem;
    transition:transform .2s ease, box-shadow .2s ease; box-shadow:0 0 20px -4px rgba(0,229,255,.6);
  }
  .btn-neon:hover{transform:translateY(-2px); box-shadow:0 0 30px -2px rgba(0,229,255,.85);}
  .btn-danger{
    background:linear-gradient(120deg,#ef4444,#dc2626);
    color:#fff; font-weight:600; border-radius:12px; padding:.45rem .9rem;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-danger:hover{transform:translateY(-1px); box-shadow:0 0 20px -2px rgba(239,68,68,.7);}
  .btn-warning{
    background:linear-gradient(120deg,#f59e0b,#d97706);
    color:#0a0d1e; font-weight:600; border-radius:12px; padding:.45rem .9rem;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-warning:hover{transform:translateY(-1px); box-shadow:0 0 20px -2px rgba(245,158,11,.7);}

  .scrollbar-thin::-webkit-scrollbar{width:6px;height:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:rgba(0,229,255,.4); border-radius:10px;}

  .timeline-dot{width:14px;height:14px;border-radius:50%; box-shadow:0 0 12px currentColor;}
  .timeline-line{height:3px; background:rgba(255,255,255,.12); position:relative; flex:1;}
  .timeline-fill{position:absolute; inset:0; background:linear-gradient(90deg,var(--cyan),var(--purple)); border-radius:3px; transition:width .6s ease;}

  .hidden{display:none !important;}
  .toast{animation: slideIn .3s ease both;}
  @keyframes slideIn{from{opacity:0; transform:translateX(40px)} to{opacity:1; transform:translateX(0)}}

  #confetti-canvas{position:fixed; inset:0; pointer-events:none; z-index:70;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(5,8,22,0.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); z-index:50;}

  /* ---------- print styles for invoices & shipping labels ---------- */
  @media print {
    body * { visibility: hidden !important; }
    #printableDoc, #printableDoc * { visibility: visible !important; color: #111 !important; }
    #printableDoc {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      background: #ffffff !important;
      color: #111111 !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
    .no-print { display: none !important; }
  }
</style>

<script>
/* ================= CONFIG ================= */
const urlParams = new URLSearchParams(window.location.search);
const overrideApi = urlParams.get("api");
const isDevFrontend = window.location.port === "5500" && (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1");

const CONFIG = {
  API_BASE: overrideApi || (isDevFrontend ? "http://localhost:8000" : window.location.origin),
  WS_BASE: overrideApi 
    ? overrideApi.replace(/^http/, "ws") 
    : (isDevFrontend ? "ws://localhost:8000" : (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host),
};

/* ================= STATE ================= */
const state = {
  token: null, user: null, role: null,
  products: [], cart: [], orders: [], analytics: null, ws: null,
  soundEnabled: true,
  shopSellerFilter: "all",
  sellerOrderFilter: "All",
  sellerSearch: "",
  sellerSort: "newest",
  sellerPage: 1,
  sellerPageSize: 8,
  // New upgraded modules:
  activeCoupon: null,
  coupons: [],
  activeChatOrderId: null,
  activeChatOrder: null,
  chatMessages: [],
  selectedPaymentMethod: "UPI",
  deliveryAddress: "Flat 402, Skyline Towers, Indiranagar, Bangalore - 560038",
  deliveryPhone: "+91 98765 43210",
  // Admin module:
  adminActiveTab: "Overview",
  adminStats: null,
  pendingSellers: [],
  pendingAdmins: [],
  adminUsers: [],
  adminOrders: [],
  adminTickets: [],
  activeTicketId: null,
  activeTicketMessages: [],
  // Smart Support Drawer:
  supportDrawerOpen: false,
  userTickets: [],
  activeUserTicketId: null,
  userTicketMessages: [],
  currentTheme: localStorage.getItem('orderflow_theme') || 'dark',
};

// Initialize Theme
if (state.currentTheme === 'light') {
  document.body.classList.add('light-theme');
}

function toggleTheme() {
  const isLight = document.body.classList.toggle('light-theme');
  state.currentTheme = isLight ? 'light' : 'dark';
  localStorage.setItem('orderflow_theme', state.currentTheme);
  const themeBtns = document.querySelectorAll('.theme-toggle-btn');
  themeBtns.forEach(btn => {
    btn.innerHTML = isLight ? '☀️ Light' : '🌙 Dark';
  });
  toast(`Switched to ${isLight ? 'Light' : 'Dark'} mode`, 'info');
}

/* ================= AUDIO CHIME ================= */
function playOrderChime() {
  if (!state.soundEnabled) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();

    osc1.type = "sine";
    osc1.frequency.setValueAtTime(587.33, now); // D5
    osc1.frequency.exponentialRampToValueAtTime(880, now + 0.12); // A5

    osc2.type = "triangle";
    osc2.frequency.setValueAtTime(880, now);
    osc2.frequency.exponentialRampToValueAtTime(1174.66, now + 0.12); // D6

    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 0.6);
    osc2.stop(now + 0.6);
  } catch(e) {}
}

/* ================= HELPERS ================= */
function toast(msg, kind="info"){
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  const color = kind==="success" ? "border-emerald-400/60 shadow-emerald-500/20" :
                kind==="error" ? "border-red-400/60 shadow-red-500/20" :
                kind==="warning" ? "border-amber-400/60 shadow-amber-500/20" :
                "border-cyan-400/60 shadow-cyan-500/20";
  el.className = `toast glass ${color} shadow-lg px-4 py-3 text-sm max-w-sm flex items-center gap-2.5`;
  const icon = kind==="success" ? "✓" : kind==="error" ? "✕" : kind==="warning" ? "⚠️" : "⚡";
  el.innerHTML = `<span class="font-bold">${icon}</span> <span>${msg}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .4s"; setTimeout(()=>el.remove(),400); }, 3800);
}

/* ================= PASSWORD VISIBILITY TOGGLE ================= */
function togglePasswordVisibility(inputId, btn){
  const input = document.getElementById(inputId);
  if(!input) return;
  const isPw = input.type === "password";
  input.type = isPw ? "text" : "password";
  btn.innerHTML = isPw 
    ? `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-cyan-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>`
    : `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white/50 hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`;
  btn.title = isPw ? "Hide password" : "Show password";
}

function fillAdminLogin(id, pw){
  const idInput = document.getElementById("loginIdInput");
  const pwInput = document.getElementById("loginPwInput");
  if(idInput) idInput.value = id;
  if(pwInput) pwInput.value = pw;
  performIdLogin(id, pw, "admin");
}

/* ================= FORGOT PASSWORD & RECOVERY ================= */
function openForgotPasswordModal(){
  const root = document.getElementById("modal-root");
  const prefillId = document.getElementById("loginIdInput")?.value?.trim() || "";
  const initialRole = state.role || window.currentRole || "customer";

  root.innerHTML = `
    <div class="modal-backdrop flex items-center justify-center p-4">
      <div class="glass glow-border p-6 sm:p-7 w-full max-w-md pop-in bg-[#070b22]/98 border-cyan-500/40 relative z-50">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-white/10">
          <div class="flex items-center gap-2">
            <span class="text-xl">🔐</span>
            <div>
              <h3 class="text-base font-bold text-white">Reset Account Password</h3>
              <p class="text-[11px] text-white/50">Recover your account using your security recovery answer</p>
            </div>
          </div>
          <button onclick="closeModal()" class="text-white/40 hover:text-white cursor-pointer p-1">✕</button>
        </div>

        <form id="forgotPasswordForm" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-white/80 mb-1">Account Role</label>
            <select id="forgotRole" class="w-full bg-[#0a0f2b] border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400">
              <option value="customer" ${initialRole==='customer'?'selected':''}>Customer (7-Digit ID)</option>
              <option value="seller" ${initialRole==='seller'?'selected':''}>Seller / Merchant (7-Digit ID)</option>
              <option value="admin" ${initialRole==='admin'?'selected':''}>Administrator (6 or 7-Digit ID)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-white/80 mb-1">Your User ID *</label>
            <input id="forgotUserId" required type="text" placeholder="e.g. 7001001 or 956673" value="${prefillId}" class="w-full bg-white/5 border border-white/10 rounded-xl px-3.5 py-2.5 text-xs font-mono text-white focus:outline-none focus:border-cyan-400" />
          </div>

          <div class="glass p-3 rounded-xl border border-cyan-500/20 bg-cyan-500/5">
            <label class="block text-xs font-bold text-cyan-300 mb-1 flex items-center gap-1.5">
              <span>🎯 Security Recovery Verification</span>
            </label>
            <p class="text-[11px] text-white/60 mb-2">Enter either your registered <strong class="text-white">Birth Place</strong> OR your <strong class="text-white">Favorite Person</strong>:</p>
            <input id="forgotSecurityAnswer" required type="text" placeholder="e.g. Chennai or Soundar" class="w-full bg-white/5 border border-white/10 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-cyan-400" />
            <p class="text-[10px] text-white/40 mt-1">Default demo hints: Chennai / Soundar (Admin), Bangalore / Tech (Sellers), Mumbai / Kalam (Customers)</p>
          </div>

          <div>
            <label class="block text-xs font-semibold text-white/80 mb-1">New Password *</label>
            <div class="relative">
              <input id="forgotNewPassword" required type="password" minlength="4" placeholder="Enter new password" class="w-full bg-white/5 border border-white/10 rounded-xl pl-3.5 pr-11 py-2 text-xs text-white focus:outline-none focus:border-cyan-400" />
              <button type="button" onclick="togglePasswordVisibility('forgotNewPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/50 hover:text-cyan-300 transition-colors cursor-pointer p-1" title="Show/Hide Password">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-white/80 mb-1">Confirm New Password *</label>
            <div class="relative">
              <input id="forgotConfirmPassword" required type="password" minlength="4" placeholder="Confirm new password" class="w-full bg-white/5 border border-white/10 rounded-xl pl-3.5 pr-11 py-2 text-xs text-white focus:outline-none focus:border-cyan-400" />
              <button type="button" onclick="togglePasswordVisibility('forgotConfirmPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/50 hover:text-cyan-300 transition-colors cursor-pointer p-1" title="Show/Hide Password">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>

          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs text-white/60 hover:text-white cursor-pointer">Cancel</button>
            <button type="submit" class="btn-neon text-xs font-bold px-5 py-2.5 cursor-pointer">Reset Password & Save 🚀</button>
          </div>
        </form>
      </div>
    </div>`;

  document.getElementById("forgotPasswordForm").onsubmit = async (e)=>{
    e.preventDefault();
    const id = document.getElementById("forgotUserId").value.trim();
    const role = document.getElementById("forgotRole").value;
    const security_answer = document.getElementById("forgotSecurityAnswer").value.trim();
    const new_password = document.getElementById("forgotNewPassword").value;
    const confirm_password = document.getElementById("forgotConfirmPassword").value;

    if(new_password !== confirm_password){
      toast("New passwords do not match!", "error");
      return;
    }

    try {
      const res = await api("/api/auth/forgot-password", {
        method: "POST",
        body: JSON.stringify({ id, role, security_answer, new_password })
      });
      closeModal();
      toast(res.detail || "Password reset successfully! Please sign in.", "success");
      const loginId = document.getElementById("loginIdInput");
      const loginPw = document.getElementById("loginPwInput");
      if(loginId) loginId.value = id;
      if(loginPw) loginPw.value = new_password;

async function api(path, opts={}){
  const headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if(state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(CONFIG.API_BASE + path, Object.assign({}, opts, {headers}));
  if(!res.ok){
    let detail = res.statusText;
    try{ detail = (await res.json()).detail || detail; }catch(e){}
    throw new Error(detail);
  }
  return res.status===204 ? null : res.json();
}

function countUp(el, target, prefix="", suffix=""){
  let cur = 0; const step = Math.max(target/40, 1);
  const iv = setInterval(()=>{
    cur += step;
    if(cur >= target){ cur = target; clearInterval(iv); }
    el.textContent = prefix + Math.round(cur).toLocaleString() + suffix;
  }, 20);
}

function confettiBurst(){
  const canvas = document.getElementById("confetti-canvas");
  canvas.width = innerWidth; canvas.height = innerHeight;
  const ctx = canvas.getContext("2d");
  const colors = ["#00E5FF","#7C3AED","#EC4899","#22c55e","#F59E0B"];
  const pieces = Array.from({length:140}, ()=>({
    x: innerWidth/2, y: innerHeight/2,
    vx:(Math.random()-.5)*16, vy:(Math.random()-1.3)*16,
    size: 4+Math.random()*6, color: colors[Math.floor(Math.random()*colors.length)],
    life: 70+Math.random()*30,
  }));
  let frame=0;
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    frame++;
    let alive=false;
    pieces.forEach(p=>{
      if(p.life<=0) return;
      alive=true;
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.life--;
      ctx.fillStyle=p.color; ctx.globalAlpha = Math.max(p.life/90,0);
      ctx.fillRect(p.x,p.y,p.size,p.size);
    });
    ctx.globalAlpha=1;
    if(alive && frame<160) requestAnimationFrame(tick); else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  tick();
}

/* ================= WEBSOCKET ================= */
function connectWebSocket(){
  if(state.ws) {
    try { state.ws.close(); } catch(e){}
  }
  const ws = new WebSocket(`${CONFIG.WS_BASE}/ws/${state.role}/${state.user.id}`);
  ws.onopen = ()=> setInterval(()=>{ if(ws.readyState===1) ws.send("ping"); }, 20000);
  ws.onmessage = (ev)=>{
    const msg = JSON.parse(ev.data);

    // 1. Incoming new order (Sent specifically to THIS particular seller!)
    if(state.role === "seller" && msg.type === "new_order"){
      playOrderChime();
      toast(`⚡ Incoming Order #${msg.order.id} — ₹${msg.order.amount.toLocaleString()}`, "success");
      state.orders.unshift(msg.order);
      refreshActiveSellerTab();
    }

    // 2. Order status update
    if(msg.type === "status_update"){
      const idx = state.orders.findIndex(o=>o.id===msg.order.id);
      if(idx>-1) state.orders[idx] = msg.order; else state.orders.unshift(msg.order);

      if(state.role === "seller"){
        refreshActiveSellerTab();
      }
      if(state.role === "customer"){
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "My Orders";
        if(activeTab === "My Orders") {
          renderCustomerOrders();
        }
        if(msg.order.status === "Completed") {
          confettiBurst();
          toast(`🎉 Order #${msg.order.id} has been Delivered!`, "success");
        } else if(msg.order.status === "Delayed") {
          toast(`⚠️ Order #${msg.order.id} Delayed (ETA ${msg.order.eta}): ${msg.order.delay_reason || 'In Transit'}`, "warning");
        } else if(msg.order.status === "Cancelled") {
          toast(`Order #${msg.order.id} was Cancelled (Inventory refunded)`, "error");
        } else {
          toast(`Order #${msg.order.id} status: ${msg.order.status}`, "success");
        }
      }
    }

    // 3. Inventory update
    if(msg.type === "inventory_update"){
      const pIdx = state.products.findIndex(p=>p.id===msg.product.id);
      if(pIdx>-1) state.products[pIdx] = msg.product; else state.products.push(msg.product);

      if(state.role === "customer") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "Shop";
        if(activeTab === "Shop") renderShop(false);
      } else if(state.role === "seller") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab;
        if(activeTab === "Products & Stock") renderInventory();
        else if(activeTab === "Overview") renderSellerOverview();
      }
    }

    // 4. Product added
    if(msg.type === "product_added"){
      const pIdx = state.products.findIndex(p=>p.id===msg.product.id);
      if(pIdx===-1) state.products.push(msg.product);
      if(state.role === "customer") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "Shop";
        if(activeTab === "Shop") renderShop(false);
      } else if(state.role === "seller") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab;
        if(activeTab === "Products & Stock") renderInventory();
      }
    }

    // 5. Product deleted
    if(msg.type === "product_deleted"){
      state.products = state.products.filter(p=>p.id!==msg.product_id);
      state.cart = state.cart.filter(i=>i.product_id!==msg.product_id);
      if(state.role === "customer") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "Shop";
        if(activeTab === "Shop") renderShop(false);
      } else if(state.role === "seller") {
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab;
        if(activeTab === "Products & Stock") renderInventory();
      }
    }

    // 6. Payment update (Seller verified payment / COD accepted)
    if(msg.type === "payment_update"){
      const idx = state.orders.findIndex(o=>o.id===msg.order.id);
      if(idx>-1) state.orders[idx] = msg.order; else state.orders.unshift(msg.order);
      playOrderChime();
      if(state.role === "seller"){
        toast(`💰 Payment confirmed for Order #${msg.order.id}`, "success");
        refreshActiveSellerTab();
      } else {
        toast(`💰 Order #${msg.order.id} payment verified: ${msg.order.payment_status}`, "success");
        const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "My Orders";
        if(activeTab === "My Orders") renderCustomerOrders();
      }
    }

    // 7. Real-time Customer <-> Seller Chat Message
    if(msg.type === "chat_message"){
      playOrderChime();
      if(state.activeChatOrderId === msg.message.order_id){
        state.chatMessages.push(msg.message);
        renderChatMessages();
      } else {
        toast(`💬 [Order #${msg.message.order_id}] ${msg.message.sender_name}: "${msg.message.message}"`, "info");
      }
    }

    // 8. Admin: New Seller Pending Verification
    if(msg.type === "new_seller_verification"){
      playOrderChime();
      if(state.role === "admin"){
        toast(`🛡️ New Seller Application: ${msg.seller_name} (${msg.brand_name || 'Store'})`, "warning");
        if(state.adminActiveTab === "Seller Verification" || state.adminActiveTab === "Overview"){
          renderAdmin(state.adminActiveTab);
        }
      }
    }

    // 9. Admin: New Admin Request Pending Approval
    if(msg.type === "new_admin_request"){
      playOrderChime();
      if(state.role === "admin"){
        toast(`🔑 New Admin Access Request: ${msg.name} (${msg.email})`, "warning");
        if(state.adminActiveTab === "Admin Accounts" || state.adminActiveTab === "Overview"){
          renderAdmin(state.adminActiveTab);
        }
      }
    }

    // 10. Admin: New Support Ticket
    if(msg.type === "new_support_ticket"){
      playOrderChime();
      if(state.role === "admin"){
        toast(`💬 Support Ticket #${msg.ticket_id} from ${msg.user_name} (${msg.category})`, "info");
        if(state.adminActiveTab === "Support Desk" || state.adminActiveTab === "Overview"){
          renderAdmin(state.adminActiveTab);
        }
      }
    }

    // 11. Support Live Chat Message (Customer/Seller <-> Admin)
    if(msg.type === "support_message"){
      playOrderChime();
      if(state.role === "admin" && state.activeTicketId === msg.message.ticket_id){
        state.activeTicketMessages.push(msg.message);
        renderAdminTicketMessages();
      } else if(state.activeUserTicketId === msg.message.ticket_id){
        state.userTicketMessages.push(msg.message);
        renderSupportChatMessages();
      } else {
        toast(`💬 [Support #${msg.message.ticket_id}] ${msg.message.sender_name}: "${msg.message.message}"`, "info");
      }
    }

    // 12. Support Ticket Reply
    if(msg.type === "support_reply"){
      playOrderChime();
      toast(`💬 Support Reply: "${msg.reply}" (${msg.status})`, "success");
      if(state.activeUserTicketId === msg.ticket_id){
        loadSupportTicketMessages(msg.ticket_id);
      }
    }

    // 13. Seller Account Approved
    if(msg.type === "account_approved"){
      confettiBurst();
      toast(`🎉 ${msg.message}`, "success");
    }
  };
  state.ws = ws;
}

    </div>
  </div>`;

  function updateLoginUi(){
    const label = document.getElementById("idInputLabel");
    const lengthHint = document.getElementById("idLengthHint");
    const input = document.getElementById("loginIdInput");
    const pw = document.getElementById("loginPwInput");
    const submitBtn = document.getElementById("submitLoginBtn");
    const adminSec = document.getElementById("adminActionSection");
    const quickSec = document.getElementById("quickProfilesSection");
    const regBtn = document.getElementById("openRegisterModalBtn");

    if(currentRole === "seller"){
      label.textContent = "7-Digit Seller ID";
      if(lengthHint) lengthHint.textContent = "Exactly 7 digits";
      input.placeholder = "1001001";
      input.pattern = "[0-9]{7}";
      pw.value = "seller123";
      if(submitBtn) submitBtn.textContent = "Sign In to Seller Hub →";
      adminSec.classList.add("hidden");
      quickSec.classList.remove("hidden");
      regBtn.textContent = "Register Seller Store (KYC)";
    } else if(currentRole === "admin"){
      label.textContent = "6-Digit Admin ID";
      if(lengthHint) lengthHint.textContent = "6 digits (e.g. 956673)";
      input.placeholder = "956673";
      input.pattern = "[0-9]{6,7}";
      pw.value = "Soundar@52122";
      if(submitBtn) submitBtn.textContent = "Sign In as Admin (ID: 956673) →";
      adminSec.classList.remove("hidden");
      quickSec.classList.add("hidden");
      regBtn.textContent = "Apply for Admin Access";
    } else {
      label.textContent = "7-Digit Customer ID";
      if(lengthHint) lengthHint.textContent = "Exactly 7 digits";
      input.placeholder = "7001001";
      input.pattern = "[0-9]{7}";
      pw.value = "customer123";
      if(submitBtn) submitBtn.textContent = "Sign In with 7-Digit ID →";
      adminSec.classList.add("hidden");
      quickSec.classList.remove("hidden");
      regBtn.textContent = "Register Customer Account";
    }


    // Render quick profile chips
    const qRoot = document.getElementById("quickProfilesContainer");
    if(qRoot && currentRole !== "admin"){
      const list = currentRole === "seller" ? profiles.sellers : profiles.customers;
      const defaultPw = currentRole === "seller" ? "seller123" : "customer123";

      qRoot.innerHTML = list.map(u=>`
        <button type="button" class="quick-chip glass px-3.5 py-2.5 rounded-xl text-left flex items-center justify-between hover:border-cyan-400/50 transition-all cursor-pointer text-xs" data-id="${u.id}" data-pw="${defaultPw}">
          <div class="flex items-center gap-2.5">
            <span class="text-lg">${currentRole==='seller'?'🏪':'👤'}</span>
            <div>
              <p class="font-bold text-white">${u.name}</p>
              <p class="text-[10px] text-white/40 font-mono">ID: #${u.id}</p>
            </div>
          </div>
          <span class="text-[10px] px-2 py-1 rounded bg-cyan-500/20 text-cyan-300 font-medium">Click to Login</span>
        </button>
      `).join("") || '<p class="text-xs text-white/40">Loading profiles...</p>';

      qRoot.querySelectorAll(".quick-chip").forEach(chip=>{
        chip.onclick = ()=>{
          document.getElementById("loginIdInput").value = chip.dataset.id;
          document.getElementById("loginPwInput").value = chip.dataset.pw;
          performIdLogin(chip.dataset.id, chip.dataset.pw, currentRole);
        };
      });
    }
  }

  document.getElementById("roleCustomerBtn").onclick = ()=>{
    currentRole="customer";
    document.getElementById("roleCustomerBtn").classList.add("active");
    document.getElementById("roleSellerBtn").classList.remove("active");
    document.getElementById("roleAdminBtn").classList.remove("active");
    updateLoginUi();
  };
  document.getElementById("roleSellerBtn").onclick = ()=>{
    currentRole="seller";
    document.getElementById("roleSellerBtn").classList.add("active");
    document.getElementById("roleCustomerBtn").classList.remove("active");
    document.getElementById("roleAdminBtn").classList.remove("active");
    updateLoginUi();
  };
  document.getElementById("roleAdminBtn").onclick = ()=>{
    currentRole="admin";
    document.getElementById("roleAdminBtn").classList.add("active");
    document.getElementById("roleCustomerBtn").classList.remove("active");
    document.getElementById("roleSellerBtn").classList.remove("active");
    updateLoginUi();
  };

  const btnSetup = document.getElementById("btnAdminSetup");
  if(btnSetup) btnSetup.onclick = ()=> openAdminSetupModal();
  const btnApply = document.getElementById("btnAdminApply");
  if(btnApply) btnApply.onclick = ()=> openAdminApplyModal();

  document.getElementById("idLoginForm").onsubmit = (e)=>{
    e.preventDefault();
    const id = document.getElementById("loginIdInput").value.trim();
    const pw = document.getElementById("loginPwInput").value;
    performIdLogin(id, pw, currentRole);
  };

  document.getElementById("openRegisterModalBtn").onclick = ()=>{
    if(currentRole === "seller") openSellerKycModal();
    else if(currentRole === "admin") openAdminApplyModal();
    else openCustomerRegisterModal();
  };

  updateLoginUi();

  // If URL specifies role and auto, automatically sign in as first default
  if(urlParams.get("auto") === "true" && currentRole !== "admin"){
    const defaultId = currentRole === "seller" ? "1001001" : "7001001";
    const defaultPw = currentRole === "seller" ? "seller123" : "customer123";
    performIdLogin(defaultId, defaultPw, currentRole);
  }
}

async function performIdLogin(id, password, role){
  try {
    const data = await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ id, password, role })
    });
    state.token = data.access_token;
    state.user = data.user;
    state.role = role;
    toast(`Welcome, ${data.user.name} (#${data.user.id})!`, "success");
    connectWebSocket();
    renderSupportFab();
    if(role === "customer") await enterCustomer();
    else if(role === "seller") await enterSeller();
    else if(role === "admin") await enterAdmin();
  } catch(e) {
    toast(e.message, "error");
  }
}

function wireNav(onSwitch){
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.onclick = ()=> onSwitch(btn.dataset.tab);
  });
  const openOther = document.getElementById("openOtherRoleBtn");
  if(openOther){
    openOther.onclick = ()=>{
      if(state.role === "admin"){
        window.open(window.location.origin + window.location.pathname + `?role=customer`, "_blank");
      } else {
        const otherRole = state.role === "customer" ? "seller" : "customer";
        window.open(window.location.origin + window.location.pathname + `?role=${otherRole}`, "_blank");
      }
    };
  }
  const soundBtn = document.getElementById("soundToggleBtn");
  if(soundBtn){
    soundBtn.onclick = ()=>{
      state.soundEnabled = !state.soundEnabled;
      toast(`Order Chime ${state.soundEnabled ? 'Enabled 🔔' : 'Muted 🔕'}`);
      if(state.soundEnabled) playOrderChime();
      const activeTab = document.querySelector("[data-tab].active")?.dataset?.tab || "Overview";
      renderSeller(activeTab);
    };
  }
  document.getElementById("logoutBtn").onclick = ()=>{
    if(state.ws) state.ws.close();
    hideSupportFab();
    closeSupportDrawer();
    Object.assign(state, {
      token:null, user:null, role:null, products:[], cart:[], orders:[], ws:null,
      adminStats:null, pendingSellers:[], pendingAdmins:[], adminUsers:[], adminTickets:[]
    });
    if(window.history.replaceState) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
    renderLogin();
  };
}

async function applyCoupon(code){
  const rawSubtotal = state.cart.reduce((s,i)=>s+i.price*i.qty,0);
  try{
    const res = await api("/api/coupons/validate", {
      method: "POST",
      body: JSON.stringify({code, order_amount: rawSubtotal})
    });
    state.activeCoupon = res;
    toast(res.message, "success");
    openCart();
  }catch(e){
    toast("Coupon: " + e.message, "error");
  }
}

      openCart();
    };
  });

  drawer.querySelectorAll("[data-qty-inc]").forEach(btn=>{
    btn.onclick = ()=>{
      const idx = +btn.dataset.qtyInc;
      const item = state.cart[idx];
      const prod = state.products.find(p=>p.id===item.product_id);
      if(prod && item.qty >= prod.stock){

      }
      item.qty += 1;
      openCart();
    };
  });

    btn.onclick = ()=>{ state.cart.splice(+btn.dataset.remove,1); openCart(); };

  drawer.querySelectorAll(".coupon-chip").forEach(chip=>{
    chip.onclick = ()=> applyCoupon(chip.dataset.code);
  });

  const co = document.getElementById("checkoutBtn");
  if(co) co.onclick = placeOrder;

async function placeOrder(){
  const rawSubtotal = state.cart.reduce((s,i)=>s+i.price*i.qty,0);
  if(rawSubtotal <= 0) return;

  const addr = (document.getElementById("deliveryAddressInput")?.value || state.deliveryAddress).trim();
  const phone = (document.getElementById("deliveryPhoneInput")?.value || state.deliveryPhone).trim();
  state.deliveryAddress = addr;
  state.deliveryPhone = phone;

  const btn = document.getElementById("checkoutBtn");
  if(btn){
    btn.disabled = true;
    btn.innerHTML = `<span class="inline-block animate-spin mr-2">⚙️</span> Processing ${state.selectedPaymentMethod} Payment...`;
  }

  try{
    const res = await api("/api/orders", {
      method:"POST",
      body: JSON.stringify({
        items: state.cart.map(i=>({product_id: i.product_id, name: i.name, price: i.price, qty: i.qty})),
        payment_method: state.selectedPaymentMethod,
        shipping_address: `${addr} (Ph: ${phone})`,
        coupon_code: state.activeCoupon ? state.activeCoupon.code : "",
        discount_amount: state.activeCoupon ? (state.activeCoupon.discount_amount || 0) : 0
      })
    });

    if(res.orders){
      res.orders.forEach(o=> state.orders.unshift(o));
    } else if(res.order){
      state.orders.unshift(res.order);
    }
    state.cart = [];
    state.activeCoupon = null;

    const drawer = document.getElementById("cartDrawer");
    if(drawer){
      drawer.dataset.open = "false";
      drawer.style.transform = "translateX(100%)";
    }

    confettiBurst();
    toast(res.message || "Order placed successfully!", "success");
    renderCustomer("My Orders");
  }catch(e){
    toast("Order failed: " + e.message, "error");
    if(btn){
      btn.disabled = false;
      btn.innerHTML = `<span>Place Order</span> ⚡`;
    }
  }
}

async function customerCancelOrder(orderId){
  if(!confirm("Are you sure you want to cancel this order? The stock will be returned.")) return;
  try{
    await api(`/api/orders/${orderId}/status`, {method:"PATCH", body: JSON.stringify({status: "Cancelled"})});
    toast(`Order #${orderId} cancelled`, "info");
    const idx = state.orders.findIndex(o=>o.id===orderId);
    if(idx>-1) state.orders[idx].status = "Cancelled";
    renderCustomerOrders();
  }catch(e){ toast("Cancellation failed: " + e.message, "error"); }
}

async function renderSeller(tab="Overview", isNewStore=false){
  const app = document.getElementById("app");

  wireNav((t)=>renderSeller(t));

  if(tab==="Overview") await renderSellerOverview(isNewStore);
  else if(tab==="Live Orders") renderSellerOrders();
  else if(tab==="Products & Stock") renderInventory();
  else if(tab==="Coupons") await renderSellerCoupons();
  else if(tab==="Branding") await renderSellerBranding();
  else renderKanban();
}

function renderSellerOrders(){
  const body = document.getElementById("sellerBody");
  if(!body) return;

  let filtered = state.orders.slice();
  if(state.sellerOrderFilter !== "All"){
    filtered = filtered.filter(o=>o.status === state.sellerOrderFilter);
  }
  if(state.sellerSearch.trim()){
    const term = state.sellerSearch.toLowerCase();
    filtered = filtered.filter(o=>
      o.id.toLowerCase().includes(term) ||
      o.customer_name.toLowerCase().includes(term) ||
      o.items.some(i=>i.name.toLowerCase().includes(term))
    );
  }

  // Sorting
  if(state.sellerSort === "highest"){
    filtered.sort((a,b)=>b.amount - a.amount);
  } else if(state.sellerSort === "lowest"){
    filtered.sort((a,b)=>a.amount - b.amount);
  } else if(state.sellerSort === "oldest"){
    filtered.sort((a,b)=>a.created_at.localeCompare(b.created_at));
  } else {
    filtered.sort((a,b)=>b.created_at.localeCompare(a.created_at));

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / state.sellerPageSize));
  if(state.sellerPage > totalPages) state.sellerPage = totalPages;
  const startIdx = (state.sellerPage - 1) * state.sellerPageSize;

        <button id="prevPageBtn" class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 disabled:opacity-30 disabled:pointer-events-none cursor-pointer" ${state.sellerPage<=1?'disabled':''}>← Previous</button>
        <span class="font-medium text-white">Page ${state.sellerPage} of ${totalPages}</span>
        <button id="nextPageBtn" class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 disabled:opacity-30 disabled:pointer-events-none cursor-pointer" ${state.sellerPage>=totalPages?'disabled':''}>Next →</button>
      </div>
    </div>
  `;

  body.querySelectorAll("[data-filter]").forEach(btn=>{
    btn.onclick = ()=>{
      state.sellerOrderFilter = btn.dataset.filter;
      state.sellerPage = 1;
      renderSellerOrders();
    };
  });

  const sInput = document.getElementById("sellerSearchInput");
  sInput.oninput = (e)=>{
    state.sellerSearch = e.target.value;
    state.sellerPage = 1;
    renderSellerOrders();
  };
  const clearBtn = document.getElementById("clearSearchBtn");
  if(clearBtn) clearBtn.onclick = ()=>{
    state.sellerSearch = "";
    state.sellerPage = 1;
    renderSellerOrders();
  };

  document.getElementById("sellerSortSelect").onchange = (e)=>{
    state.sellerSort = e.target.value;
    renderSellerOrders();
  };

  const prevBtn = document.getElementById("prevPageBtn");
  if(prevBtn) prevBtn.onclick = ()=>{ if(state.sellerPage > 1){ state.sellerPage--; renderSellerOrders(); } };
  const nextBtn = document.getElementById("nextPageBtn");
  if(nextBtn) nextBtn.onclick = ()=>{ if(state.sellerPage < totalPages){ state.sellerPage++; renderSellerOrders(); } };
}

function sellerActionButtons(o){
  if(o.status === "Cancelled") return `<span class="text-xs text-white/30">Cancelled</span>`;
  if(o.status === "Completed"){
    return `
      <span class="text-xs text-emerald-400 font-semibold">✓ Delivered</span>
      <button class="text-[11px] px-2.5 py-1 rounded-xl bg-white/5 hover:bg-white/10 text-cyan-300 border border-cyan-500/30 cursor-pointer" onclick="openInvoiceModal('${o.id}')">📄 Invoice</button>
      <button class="text-[11px] px-2.5 py-1 rounded-xl bg-purple-500/15 hover:bg-purple-500/25 text-purple-300 border border-purple-500/30 cursor-pointer" onclick="openChatDrawer('${o.id}')">💬 Chat</button>
    `;
  }

  const paymentPending = o.payment_status && (o.payment_status === 'Pending COD' || o.payment_status === 'Pending');
  let payBtn = paymentPending
    ? `<button class="text-[11px] px-2 py-1 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 cursor-pointer font-semibold" onclick="sellerAcceptPayment('${o.id}')">💰 Accept COD</button>`
    : '';

  let advanceBtn = '';
  if(o.status === "Placed"){
    advanceBtn = `<button class="btn-neon text-[11px] py-1 px-2.5 cursor-pointer" onclick="advanceOrderStatus('${o.id}', 'Processing')">Process</button>`;
  } else if(o.status === "Processing" || o.status === "Delayed"){
    advanceBtn = `<button class="btn-neon text-[11px] py-1 px-2.5 cursor-pointer" onclick="advanceOrderStatus('${o.id}', 'Completed')">Complete</button>`;
  }

  return `
    ${advanceBtn}
    ${payBtn}
    <button class="text-[11px] px-2 py-1 rounded-xl bg-purple-500/15 hover:bg-purple-500/25 text-purple-300 border border-purple-500/30 cursor-pointer" onclick="openChatDrawer('${o.id}')">💬</button>
    <button class="btn-warning text-[11px] py-1 px-2.5 cursor-pointer" onclick="openDelayModal('${o.id}', '${o.eta}')">Delay</button>
    <button class="btn-danger text-[11px] py-1 px-2.5 cursor-pointer" onclick="openCancelModal('${o.id}')">Cancel</button>
  `;
}

async function sellerAcceptPayment(orderId){

async function adjustProductStock(productId, delta){

    if(pIdx>-1) state.products[pIdx] = updated;
    toast(`Updated ${updated.name} stock to ${updated.stock}`, "success");
    renderInventory();
  }catch(e){ toast("Stock update failed: "+e.message, "error"); }
}

async function deleteProductPrompt(productId, productName){
  if(!confirm(`Are you sure you want to delete "${productName}" from your store catalog?`)) return;
  try{
    await api(`/api/products/${productId}`, {method:"DELETE"});
    state.products = state.products.filter(p=>p.id!==productId);
    toast(`Deleted ${productName}`, "info");
    renderInventory();
  }catch(e){ toast("Deletion failed: "+e.message, "error"); }
}

function switchInvTab(tab){
  document.getElementById('invoice-tab').classList.toggle('hidden', tab!=='invoice');
  document.getElementById('shipping-tab').classList.toggle('hidden', tab!=='shipping');
  document.getElementById('invTabBtn').className = `px-6 py-3 text-xs font-semibold cursor-pointer border-b-2 ${ tab==='invoice' ? 'text-cyan-300 border-cyan-400' : 'text-white/50 border-transparent hover:text-white' }`;
  document.getElementById('shipTabBtn').className = `px-6 py-3 text-xs font-semibold cursor-pointer border-b-2 ${ tab==='shipping' ? 'text-purple-300 border-purple-400' : 'text-white/50 border-transparent hover:text-white' }`;
}

function printSection(tabId){
  switchInvTab(tabId === 'invoice-tab' ? 'invoice' : 'shipping');
  setTimeout(()=>window.print(), 200);
}

/* ================= REAL-TIME ORDER CHAT DRAWER ================= */
async function openChatDrawer(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  state.activeChatOrderId = orderId;
  state.activeChatOrder = order || {id: orderId};

  let messages = [];
  try{ messages = await api(`/api/orders/${orderId}/messages`); }catch(e){}
  state.chatMessages = messages;

  const drawer = document.getElementById('chatDrawer');
  const other = state.role === 'customer' ? (order?.seller_name || 'Seller') : (order?.customer_name || 'Customer');
  const otherIcon = state.role === 'customer' ? '🏪' : '👤';

  drawer.innerHTML = `
    <div class="glass glow-border h-full p-4 flex flex-col pop-in bg-[#070b22]/98 border-purple-400/40 overflow-hidden">
      <!-- Header -->
      <div class="flex justify-between items-center pb-3 mb-3 border-b border-white/10 shrink-0">
        <div>
          <h3 class="font-bold text-base text-white flex items-center gap-2">
            <span>💬 Order Chat</span>
            <span class="text-xs font-mono text-purple-300 px-2 py-0.5 bg-purple-500/10 rounded-md border border-purple-500/20">#${orderId}</span>
          </h3>
          <p class="text-[11px] text-white/50 mt-0.5">${otherIcon} ${other}</p>
        </div>
        <button onclick="closeChatDrawer()" class="text-white/40 hover:text-white cursor-pointer p-1">✕</button>
      </div>

      <!-- Messages -->
      <div id="chatMessagesContainer" class="flex-1 overflow-y-auto scrollbar-thin space-y-3 pr-1 pb-2"></div>

      <!-- Input -->
      <div class="pt-3 border-t border-white/10 shrink-0">
        <div class="flex gap-2">
          <input id="chatInput" type="text" placeholder="Type a message..." maxlength="500"
            class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-white/40 focus:outline-none focus:border-purple-400"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage();}" />
          <button onclick="sendChatMessage()" class="px-4 py-2.5 rounded-xl text-sm font-bold cursor-pointer flex-shrink-0" style="background:linear-gradient(120deg,#7C3AED,#4338CA);color:#fff;">Send ↗</button>
        </div>
        <p class="text-[10px] text-white/30 mt-1.5">Messages are delivered in real-time to both parties</p>
      </div>
    </div>`;

  drawer.style.transform = 'translateX(0)';
  drawer.dataset.open = 'true';
  renderChatMessages();
}

function closeChatDrawer(){
  const drawer = document.getElementById('chatDrawer');
  drawer.style.transform = 'translateX(100%)';
  drawer.dataset.open = 'false';
  state.activeChatOrderId = null;
  state.activeChatOrder = null;
}

function renderChatMessages(){
  const container = document.getElementById('chatMessagesContainer');
  if(!container) return;

  if(state.chatMessages.length === 0){
    container.innerHTML = `
      <div class="flex flex-col items-center justify-center h-full text-center py-10">
        <span class="text-4xl mb-2">💬</span>
        <p class="text-sm font-bold text-white">Start the conversation</p>
        <p class="text-xs text-white/50 mt-1">Ask about order status, delivery, or anything else</p>
      </div>`;
    return;
  }

  container.innerHTML = state.chatMessages.map(msg=>{
    const isMine = msg.sender_id === state.user.id;
    const time = msg.timestamp.replace('T',' ').slice(11,16);
    const roleIcon = msg.sender_role === 'seller' ? '🏪' : '👤';
    return `
      <div class="flex ${isMine ? 'justify-end' : 'justify-start'}">
        <div class="max-w-[80%] ${isMine ? 'items-end' : 'items-start'} flex flex-col gap-0.5">
          ${!isMine ? `<span class="text-[10px] text-white/40 ml-1">${roleIcon} ${msg.sender_name}</span>` : ''}
          <div class="px-3.5 py-2.5 rounded-2xl text-sm ${isMine
            ? 'rounded-tr-sm text-white' 
            : 'rounded-tl-sm text-white/90 bg-white/10 border border-white/10'
          }" style="${isMine ? 'background:linear-gradient(120deg,#7C3AED,#4338CA)' : ''}">
            ${msg.message}
          </div>
          <span class="text-[9px] text-white/30 ${isMine ? 'text-right mr-1' : 'ml-1'}">${time}</span>
        </div>
      </div>`;
  }).join('');

  container.scrollTop = container.scrollHeight;
}

async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text || !state.activeChatOrderId) return;

  input.value = '';
  try{
    const msg = await api(`/api/orders/${state.activeChatOrderId}/messages`, {
      method: 'POST',
      body: JSON.stringify({message: text})
    });
    // Locally append (the WebSocket will also push to recipient)
    state.chatMessages.push(msg);
    renderChatMessages();
  }catch(e){ toast('Message failed: '+e.message, 'error'); input.value = text; }
}

/* ================= TAX INVOICE & PDF ================= */
async function downloadOrderInvoice(orderId){
  try {
    toast(`Generating Tax Invoice PDF for #${orderId}...`, "info");
    const res = await fetch(`${CONFIG.API_BASE}/api/orders/${orderId}/invoice`, {
      headers: { "Authorization": "Bearer " + state.token }
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error(err.detail || "Failed to download invoice");
    }
    const contentType = res.headers.get("content-type");
    if(contentType && contentType.includes("application/pdf")){
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Invoice_${orderId}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
      toast("Invoice PDF downloaded!", "success");
    } else {
      const data = await res.json();
      alert(`📄 Invoice INV-${orderId}\n\nAmount: ₹${data.financials?.grand_total || 'N/A'}\nTaxable: ₹${data.financials?.taxable_value || 'N/A'}\nGST (18%): ₹${data.financials?.gst_total || 'N/A'}`);
    }
  } catch(e){
    toast("Invoice download: " + e.message, "error");
  }
}

          </div>
          <button onclick="closeSupportDrawer()" class="text-white/40 hover:text-white cursor-pointer p-1">✕</button>
        </div>

        <!-- MANDATORY SINCERE APOLOGY FIRST -->
        <div class="glass p-4 rounded-xl border border-rose-500/40 bg-gradient-to-r from-rose-950/40 to-purple-950/40 mb-4 fade-up">
          <div class="flex items-start gap-2.5">
            <span class="text-xl">🙏</span>
            <div class="text-xs leading-relaxed text-white">
              <p class="font-bold text-rose-300 mb-1">We are truly sorry for this experience 🙏</p>
              Your satisfaction is our absolute priority, and we sincerely apologize for any inconvenience, delay, or frustration caused. Please share the details below so our admin team can step in immediately and make this right for you.
            </div>
          </div>
        </div>

        <!-- Complaint Form -->
        <form id="complaintForm" class="space-y-3.5 text-xs">
          <div>
            <label class="block font-semibold text-white/80 mb-1">Issue Category *</label>
            <select id="compCategory" class="w-full bg-[#0a0f2b] border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
              <option value="Delivery Delay">⏱️ Delivery Delay / ETA Exceeded</option>
              <option value="Damaged or Wrong Item">📦 Damaged, Missing, or Wrong Item</option>
              <option value="Payment / Refund Issue">💳 Payment Deducted / Refund Delay</option>
              <option value="Seller Issue">🏪 Seller Communication / Fulfillment Problem</option>
              <option value="App or Website Issue">⚡ Technical Glitch or Bug</option>
              <option value="Other Complaint">📝 Other General Grievance</option>
            </select>
          </div>

          <div>
            <label class="block font-semibold text-white/80 mb-1">What went wrong? (Detailed description) *</label>
            <textarea id="compDesc" required rows="3" placeholder="Please describe the issue in detail, order ID if applicable..." class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400"></textarea>
          </div>

          <div>
            <label class="block font-semibold text-white/80 mb-1.5">How would you rate your experience so far?</label>
            <div class="flex items-center gap-2 text-xl" id="starRatingContainer">
              ${[1,2,3,4,5].map(star => `
                <button type="button" class="star-btn text-white/30 hover:text-amber-400 transition-colors cursor-pointer" data-val="${star}">★</button>
              `).join('')}
            </div>
            <input type="hidden" id="compRating" value="1" />
          </div>

          <div class="pt-2">
            <button type="submit" class="btn-neon w-full py-2.5 font-bold text-xs cursor-pointer shadow-xl flex items-center justify-center gap-2">
              <span>Submit Grievance & Connect Live Chat 🚀</span>
            </button>
          </div>
        </form>
      </div>

      <div class="pt-3 border-t border-white/5 text-center text-[10px] text-white/40">
        Your complaint will be directly visible to the Platform Administrator.
      </div>
    </div>`;

  let currentStars = 1;
  const starBtns = drawer.querySelectorAll(".star-btn");
  starBtns.forEach(btn => {
    btn.onclick = ()=>{
      currentStars = +btn.dataset.val;
      document.getElementById("compRating").value = currentStars;
      starBtns.forEach((b, idx) => {
        b.className = idx < currentStars ? "star-btn text-amber-400 cursor-pointer" : "star-btn text-white/30 cursor-pointer";
      });
    };
  });
  // Default 1 star
  starBtns[0].className = "star-btn text-amber-400 cursor-pointer";

  document.getElementById("complaintForm").onsubmit = async (e)=>{
    e.preventDefault();
    const category = document.getElementById("compCategory").value;
    const description = document.getElementById("compDesc").value.trim();
    const rating = +document.getElementById("compRating").value;

    try {
      const data = await api("/api/support/ticket", {
        method: "POST",
        body: JSON.stringify({ category, description, rating })
      });
      toast(`Support Ticket #${data.ticket_id} opened. Connecting to admin...`, "success");
      state.activeUserTicketId = data.ticket_id;
      await loadSupportTicketMessages(data.ticket_id);
    } catch(err){
      toast("Error submitting complaint: " + err.message, "error");
    }
  };
}

async function loadSupportTicketMessages(ticketId){
  state.activeUserTicketId = ticketId;
  try {
    state.userTicketMessages = await api(`/api/support/tickets/${ticketId}/messages`);
  } catch(e){
    state.userTicketMessages = [];
  }
  renderSupportChatMessages();
}

function renderSupportChatMessages(){
  const drawer = document.getElementById("supportDrawer");
  if(!drawer || !state.activeUserTicketId) return;

  drawer.innerHTML = `
    <div class="glass glow-border h-full flex flex-col justify-between p-4 bg-[#070b22]/98 shadow-2xl">
      <!-- Header -->
      <div class="flex justify-between items-center pb-3 border-b border-white/10">
        <div class="flex items-center gap-2">
          <button onclick="state.activeUserTicketId=null; renderSupportDrawerContent();" class="text-xs text-white/50 hover:text-white cursor-pointer mr-1">←</button>
          <div>
            <h3 class="text-xs font-bold text-white flex items-center gap-1.5">
              <span>💬 Live Support Desk</span>
              <span class="font-mono text-cyan-300">#${state.activeUserTicketId}</span>
            </h3>
            <span class="text-[10px] text-emerald-400 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block animate-ping"></span> Live Admin Channel
            </span>
          </div>
        </div>
        <button onclick="closeSupportDrawer()" class="text-white/40 hover:text-white cursor-pointer p-1">✕</button>
      </div>

      <!-- Messages Thread -->
      <div id="userSupportChatThread" class="flex-1 overflow-y-auto py-3 space-y-2.5 scrollbar-thin my-2">
        ${state.userTicketMessages.length === 0 ? `
          <div class="text-center py-8 text-xs text-white/40">
            <span class="text-2xl block mb-2">🙏</span>
            We've notified the platform administrator. An agent is reviewing your grievance and will reply here in real-time.
          </div>
        ` : state.userTicketMessages.map(m => {
          const isMe = m.sender_id === state.user.id;
          return `
            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
              <div class="text-[9px] text-white/40 mb-0.5 px-1">${m.sender_name} (${m.sender_role})</div>
              <div class="max-w-[85%] px-3.5 py-2 rounded-2xl text-xs ${isMe ? 'bg-cyan-500/20 text-cyan-200 rounded-tr-none border border-cyan-400/40' : 'bg-purple-500/20 text-white rounded-tl-none border border-purple-400/40'}">
                ${m.message}
              </div>
              <div class="text-[9px] text-white/30 font-mono mt-0.5 px-1">${(m.timestamp || '').slice(11, 16)}</div>
            </div>`;
        }).join('')}
      </div>

      <!-- Input Form -->
      <form id="userSupportMsgForm" class="pt-2 border-t border-white/10 flex gap-2">
        <input id="userSupportMsgInput" required type="text" placeholder="Type message to admin..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400" />
        <button type="submit" class="btn-neon text-xs font-bold px-4 py-2 cursor-pointer">Send</button>
      </form>
    </div>`;

  const thread = document.getElementById("userSupportChatThread");
  if(thread) thread.scrollTop = thread.scrollHeight;

  document.getElementById("userSupportMsgForm").onsubmit = async (e)=>{
    e.preventDefault();
    const input = document.getElementById("userSupportMsgInput");
    const text = input.value.trim();
    if(!text) return;
    input.value = "";

    try {
      const newMsg = await api(`/api/support/tickets/${state.activeUserTicketId}/messages`, {
        method: "POST",
        body: JSON.stringify({ message: text })
      });
      state.userTicketMessages.push(newMsg);
      renderSupportChatMessages();
    } catch(err){
      toast("Error sending message: " + err.message, "error");
    }
  };
}

function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

          <span class="text-[10px] uppercase font-bold tracking-wider text-rose-300 bg-rose-500/10 px-2 py-0.5 rounded border border-rose-500/20">Role-Based Access Control</span>
          <h2 class="text-2xl font-bold text-white mt-1">Admin Approvals & Accounts</h2>
          <p class="text-xs text-white/50">Authorize new platform administrators or revoke privileges</p>
        </div>
        <span class="text-xs px-3 py-1.5 rounded-full bg-purple-500/10 text-purple-300 border border-purple-500/30 font-bold">
          ${pending.length} Pending Approval(s)
        </span>
      </div>

      <!-- Pending Applications Section -->
      <div class="mb-8">
        <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-3 flex items-center gap-2">
          <span>⏳ Pending Admin Access Applications</span>
        </h3>

        ${pending.length === 0 ? `
          <div class="glass p-6 text-center rounded-xl border border-white/5">
            <p class="text-xs text-white/50">No pending admin applications awaiting approval.</p>
          </div>
        ` : `
          <div class="space-y-3">
            ${pending.map(a => `
              <div class="glass p-4 rounded-xl border border-purple-500/40 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 fade-up">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-white text-sm">${a.name}</span>
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-purple-500/20 text-purple-300">ID: #${a.id}</span>
                  </div>
                  <p class="text-xs text-white/60">Email: <strong class="text-white">${a.email}</strong></p>
                  ${a.brand_description ? `<p class="text-[11px] text-white/40 mt-1">Reason: "${a.brand_description}"</p>` : ''}
                </div>

                <div class="flex items-center gap-2">
                  <button onclick="adminApproveAdmin('${a.id}')" class="btn-neon text-xs font-bold px-4 py-2 cursor-pointer flex items-center gap-1">
                    <span>✓ Authorize Admin</span>
                  </button>
                  <button onclick="adminRejectAdmin('${a.id}')" class="btn-danger text-xs font-bold px-3 py-2 cursor-pointer">
                    <span>✕ Reject</span>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      </div>

      <!-- Active Platform Administrators List -->
      <div>
        <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-3 flex items-center gap-2">
          <span>🛡️ Active Platform Administrators (${allUsers.filter(u=>u.status==='active').length})</span>
        </h3>

        <div class="space-y-2.5">
          ${allUsers.map(a => {
            const isFounder = a.is_first_admin === 1 || a.is_first_admin === true;
            return `
              <div class="glass p-3.5 rounded-xl border border-white/10 flex justify-between items-center text-xs">
                <div class="flex items-center gap-3">
                  <img src="${a.picture || 'https://api.dicebear.com/7.x/identicon/svg?seed=' + a.name}" class="w-8 h-8 rounded-full border border-white/20" />
                  <div>
                    <p class="font-bold text-white flex items-center gap-2">
                      <span>${a.name}</span>
                      <span class="font-mono text-cyan-300 text-[10px]">#${a.id}</span>
                    </p>
                    <p class="text-[10px] text-white/40">${a.email}</p>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  ${isFounder ? `
                    <span class="text-[10px] font-bold text-amber-300 px-2.5 py-1 rounded bg-amber-500/10 border border-amber-500/30">👑 Founder (Supreme Authority)</span>
                  ` : `
                    <span class="text-[10px] font-semibold text-emerald-300 px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">Verified Admin</span>
                    <button onclick="adminDeleteUser('${a.id}', '${(a.name||'Admin').replace(/'/g, "\\'")}', 'admin')" class="px-2.5 py-1 rounded-lg bg-red-500/20 hover:bg-red-500/40 text-red-300 border border-red-500/40 text-[10px] font-bold cursor-pointer flex items-center gap-1" title="Revoke and permanently delete this admin ID">
                      <span>🗑️ Delete Admin</span>
                    </button>
                  `}
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
}

async function adminApproveAdmin(adminId){
  try {
    await api(`/api/admin/admins/${adminId}/approve`, { method: "POST" });
    confettiBurst();
    toast(`Admin ID #${adminId} has been authorized!`, "success");
    await renderAdminAccounts();
  } catch(e){
    toast("Approval error: " + e.message, "error");
  }
}

async function adminRejectAdmin(adminId){
  if(!confirm("Are you sure you want to reject this admin request?")) return;
  try {
    await api(`/api/admin/admins/${adminId}/reject`, { method: "POST" });
    toast(`Admin ID #${adminId} was rejected.`, "info");
    await renderAdminAccounts();
  } catch(e){
    toast("Rejection error: " + e.message, "error");
  }
}

/* ---------- ADMIN TAB 7: PLATFORM CONFIG & COUPONS ---------- */
async function renderAdminConfig(){
  const body = document.getElementById("adminBody");
  if(!body) return;

  let config = {};
  try {
    config = await api("/api/admin/platform-config");
  } catch(e){}

  let coupons = [];
  try {
    coupons = await api("/api/coupons");
  } catch(e){}

  body.innerHTML = `
    <div class="glass glow-border p-6 mb-6 fade-up">
      <div class="flex justify-between items-center mb-6">
        <div>
          <span class="text-[10px] uppercase font-bold tracking-wider text-cyan-300 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20">Infrastructure & Marketing</span>
          <h2 class="text-2xl font-bold text-white mt-1">Platform Configurations & Promo Engine</h2>
          <p class="text-xs text-white/50">System architecture health, integrations, and marketplace discount coupons</p>
        </div>
      </div>

      <!-- System Integration Health Badges -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="glass p-4 rounded-xl border border-white/10">
          <span class="text-[10px] uppercase font-bold text-white/40 block mb-1">Gemini AI Engine</span>
          <p class="text-sm font-bold text-white flex items-center gap-1.5">
            ${config.gemini_enabled ? '<span class="text-emerald-400">● Active</span>' : '<span class="text-amber-400">○ Mock / Fallback</span>'}
          </p>
          <p class="text-[10px] text-white/40 mt-1">${config.gemini_enabled ? 'Gemini 2.0 Flash enabled' : 'Set GEMINI_API_KEY env var'}</p>
        </div>

        <div class="glass p-4 rounded-xl border border-white/10">
          <span class="text-[10px] uppercase font-bold text-white/40 block mb-1">Razorpay Payments</span>
          <p class="text-sm font-bold text-white flex items-center gap-1.5">
            ${config.razorpay_enabled ? '<span class="text-emerald-400">● Live Keys</span>' : '<span class="text-amber-400">○ Test / Dev Mode</span>'}
          </p>
          <p class="text-[10px] text-white/40 mt-1">${config.razorpay_enabled ? 'HMAC-SHA256 signature verified' : 'Set RAZORPAY_KEY_ID env var'}</p>
        </div>

        <div class="glass p-4 rounded-xl border border-white/10">
          <span class="text-[10px] uppercase font-bold text-white/40 block mb-1">Email Delivery (Resend)</span>
          <p class="text-sm font-bold text-white flex items-center gap-1.5">
            ${config.email_enabled ? '<span class="text-emerald-400">● Active</span>' : '<span class="text-amber-400">○ Mock Mode</span>'}
          </p>
          <p class="text-[10px] text-white/40 mt-1">${config.email_enabled ? 'Transactional KYC emails sending' : 'Set RESEND_API_KEY env var'}</p>
        </div>

        <div class="glass p-4 rounded-xl border border-white/10">
          <span class="text-[10px] uppercase font-bold text-white/40 block mb-1">Database Engine</span>
          <p class="text-sm font-bold text-white capitalize flex items-center gap-1.5">
            <span class="text-cyan-400">● ${config.database || 'SQLite'}</span>
          </p>
          <p class="text-[10px] text-white/40 mt-1">Dual SQLite / PostgreSQL ready</p>
        </div>
      </div>

      <!-- Marketplace Global Coupons -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-sm font-bold text-white uppercase tracking-wider">
            🏷️ Global Marketplace Coupons (${coupons.length})
          </h3>
          <button onclick="openAdminCreateCouponModal()" class="btn-neon text-xs font-bold px-3.5 py-1.5 cursor-pointer">
            ➕ Create Promo Code
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          ${coupons.map(c => `
            <div class="glass p-3.5 rounded-xl border border-white/10 flex flex-col justify-between text-xs">
              <div class="flex justify-between items-start mb-2">
                <span class="font-mono font-bold text-cyan-300 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20">${c.code}</span>
                <button onclick="adminDeleteCoupon('${c.id}')" class="text-red-400 hover:text-red-300 text-xs cursor-pointer">✕</button>
              </div>
              <p class="text-sm font-bold text-white">
                ${c.discount_type === 'percent' ? `${c.discount_value}% OFF` : `₹${c.discount_value} FLAT`}
              </p>
              <p class="text-[10px] text-white/40 mt-1">Min Order: ₹${c.min_order} · Store: ${c.seller_id === 'all' ? 'All Stores' : '#' + c.seller_id}</p>
            </div>
          `).join('') || '<p class="text-xs text-white/40 py-4">No active coupons found.</p>'}
        </div>
      </div>
    </div>`;
}

function openAdminCreateCouponModal(){
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-backdrop flex items-center justify-center p-4">
      <div class="glass glow-border p-6 w-full max-w-md pop-in bg-[#070b22]/98 relative z-50">
        <h3 class="text-base font-bold text-white mb-1">Create Platform Coupon</h3>
        <p class="text-xs text-white/50 mb-4">Applicable across all seller stores</p>

        <form id="adminCouponForm" class="space-y-3.5 text-xs">
          <div>
            <label class="block font-semibold text-white/80 mb-1">Promo Code *</label>
            <input id="adCoupCode" required type="text" placeholder="e.g. FESTIVE20" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs font-mono uppercase text-white focus:outline-none focus:border-cyan-400" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-white/80 mb-1">Discount Type</label>
              <select id="adCoupType" class="w-full bg-[#0a0f2b] border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
                <option value="percent">Percentage (%)</option>
                <option value="flat">Flat Amount (₹)</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold text-white/80 mb-1">Discount Value *</label>
              <input id="adCoupVal" required type="number" step="any" placeholder="15" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400 font-mono" />
            </div>
          </div>

          <div>
            <label class="block font-semibold text-white/80 mb-1">Minimum Order Amount (₹)</label>
            <input id="adCoupMin" type="number" step="any" value="300" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400 font-mono" />
          </div>

          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs text-white/60 hover:text-white cursor-pointer">Cancel</button>
            <button type="submit" class="btn-neon text-xs font-bold px-5 py-2 cursor-pointer">Create Coupon</button>
          </div>
        </form>
      </div>
    </div>`;

  document.getElementById("adminCouponForm").onsubmit = async (e)=>{
    e.preventDefault();
    const code = document.getElementById("adCoupCode").value.trim().toUpperCase();
    const discount_type = document.getElementById("adCoupType").value;
    const discount_value = parseFloat(document.getElementById("adCoupVal").value);
    const min_order = parseFloat(document.getElementById("adCoupMin").value) || 0;

    try {
      await api("/api/coupons", {
        method: "POST",
        body: JSON.stringify({ code, discount_type, discount_value, min_order })
      });
      closeModal();
      toast(`Coupon ${code} created successfully!`, "success");
      await renderAdminConfig();
    } catch(err){
      toast("Error creating coupon: " + err.message, "error");
    }
  };
}

async function adminDeleteCoupon(couponId){
  if(!confirm("Delete this coupon code?")) return;
  try {
    await api(`/api/coupons/${couponId}`, { method: "DELETE" });
    toast("Coupon removed", "info");
    await renderAdminConfig();
  } catch(e){
    toast("Delete failed: " + e.message, "error");
  }
}

function closeModal(){
  const modal = document.getElementById("modal-root");
  if(modal) modal.innerHTML = "";
}

/* ================= BOOTSTRAP ================= */
renderLogin();
</script>
</body>
